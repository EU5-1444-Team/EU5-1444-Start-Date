l_english:
 burgundian_feudalism: "[GetCountry('BUR').GetAdjectiveWithNoTooltip] Feudalism"
 burgundian_feudalism_desc: "Our rapid acquisition of territories in the Lowlands has meant we have had to compromise with the local nobility on certain rights and privileges."
 grand_duchy_lit: "Grand Duchy"
 grand_duchy_lit_desc: "Our rapid acquisition of territories in Ruthenia has meant we have had to compromise with the local nobility on certain rights and privileges."
 nutsaldom: "Nutsaldom"
 nutsaldom_desc: "The Avar tradition of independent noble leadership in the Caucasus mountains has been formalized into a system of governance that emphasizes defensive strength and local autonomy."
 shamkhalate: "Shamkhalate"
 shamkhalate_desc: "The rulers of Gazikumukh and Tarki have formalized the office of the Shamkhal into a durable tribal state, balancing military authority, frontier defense, and the loose loyalties of the northern Caucasus."
 utsmiate: "Utsmiate"
 utsmiate_desc: "The Kaitag have formalized their maritime and mountain leadership into the office of the Utsmi, a tribal state balancing coastal defense with the traditions of the Caucasus."
 turkoman_confederation: "Turkoman Confederation"
 turkoman_confederation_desc: "The Turkomans have formalized their tribal leadership into a confederation, balancing the demands of frontier defense with the traditions of the steppe."
 timurid_prince: "Timurid Prince"
 timurid_prince_desc: "Descendant of the great conqueror Tamerlane. Our right to succession is contested by our cousins, but we may still prove our right through arms."
 baduspanid_sassanid_legacy: "Sassanid Legacy"
 baduspanid_sassanid_legacy_desc: "We the Baduspanids can trace our lineage back to the Dayubids, and from them the royal Sassananian line. This source of legitmancy gives us a claim to Iran no others can match"
 legacy_of_kublai_khan_reform: "Legacy of Kublai Khan"
 legacy_of_kublai_khan_reform_desc: "The Great Khan sat upon the Dragon Throne and called himself Son of Heaven. We have done the same. The Yuan is not a memory to be mourned — it is a living inheritance, and we are its heirs. Let the chancelleries be filled, let the tax registers be kept, let the silk road flow again. The Mongol carries the mandate now as he always did — not by blood alone, but by the weight of administration and the patience of empire"
 legacy_of_the_steppe_reform: "Legacy of the Steppe"
 legacy_of_the_steppe_reform_desc: "No wall was ever built high enough. No dynasty ever endured long enough. But the steppe endures. We have not restored what was lost — we have remembered what was never truly gone. The tribes ride as one. The pastures are ours. The sky is wide and the horse is swift, and that has always been enough to shake the world"
 european_tribe_unification_reform: "Masters of the Forest-Steppe"
 european_tribe_unification_reform_desc: "Where the endless trees meet the open horizon, our people have long survived in the shadows of empires. No longer. By binding the fractured clans of the wild woodlands and the frontier plains into a single, unyielding fist, we have forged a new power. We are the shield against the nomads and the axe that clears the path forward. The rivers are our highways, the canopy is our fortress, and the frontier is ours to rule"

 legacy_of_khasar: "Legacy of Khasar Khān"
 legacy_of_khasar_desc: "The blood of Khasar the Archer flows through us. While others claim the Great Khān's crown, we claim the unmatched prowess of his most loyal brother, the guardians of his eastern flank"
 mongol_khagan: "Mongol Khāghān"
 mongol_khagan_desc: "Inheritors of the Blue Wolf's decree. As direct descendants of Temujin, our word is the law of the steppe and our mandate is the unification of all who dwell in our great lands"
 seal_of_yuan: "Seal of Great Yuan"
 seal_of_yuan_desc: "A heavy jade testament to a dual destiny. The Mandate of Heaven, fused with the might of the Khāns of the steppe. A claim to the Dragon Throne and the endless plains alike"
 oirat_unification_reform: "Oirat Great Confederation"
 oirat_unification_reform_desc: "The disparate tribes of the Oirat have finally merged into a single, centralized entity. By balancing the old laws of the steppe with a new, unified command, we ensure the legacy of the Four Oirat remains eterna."
 eastern_steppe_unification_reform: "Unified Steppe Administration"
 eastern_steppe_unification_reform_desc: "Having brought the eastern tribes under a single banner, we have moved beyond a loose collection of interests into a formalized state capable of projecting power across the silk road"
 oirat_forest_legacy: "Legacy of the Forest Oirats"
 oirat_forest_legacy_desc: "Born of the deep taiga and the mountain shadows, we are the 'People of the Woods.' Our ancestors navigated the dense thickets long before they mastered the open plains, granting us a resilience and a mastery of the rugged terrain that the steppe-born can only envy"
 legacy_of_chagatai: "Legacy of Chagatai Khan"
 legacy_of_chagatai_desc: "Keepers of the Yassa and guardians of the Central Asian heartland. As the descendants of the Great Khan’s second son, we are the stern adjudicators of Mongol law. Our domain is the bridge between East and West, tempered by the sophisticated cultures of the Silk Road and the unyielding tradition of the nomad"
 legacy_of_jochi: "Legacy of Jochi Khan"
 legacy_of_jochi_desc: "Masters of the Golden Horizon. Though some whisper of our lineage's origins, none can deny the sheer scale of the domains carved by the eldest branch. From the frozen forests of the North to the shores of the Black Sea, we rule the furthest reaches of the empire with a strength that remains unshaken by distance"