l_english:
  burgundian_feudalism: "[GetCountry('BUR').GetAdjectiveWithNoTooltip] Feudalism"
  burgundian_feudalism_desc: "Our rapid acquisition of territories in the Lowlands has meant we have had to compromise with the local nobility on certain rights and privileges."
  grand_duchy_lit: "Grand Duchy"
  grand_duchy_lit_desc: "Our rapid acquisition of territories in Ruthenia has meant we have had to compromise with the local nobility on certain rights and privileges."
  saopha_order: "Saopha Order"
  saopha_order_desc: "Authority rests not in a single court but in the gathered houses of the saophas. Each valley lord keeps his own retainers and answers the call to war according to custom and honour, not command. When united, their hosts descend swiftly upon their enemies; when at peace, they return to their hills and govern as they have for generations. Such a realm is fierce in battle, yet difficult to bind into a single hand."