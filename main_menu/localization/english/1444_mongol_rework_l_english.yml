#Random pockets
 legacy_of_khasar: "Legacy of Khasar Khān"
 legacy_of_khasar_desc: "The blood of Khasar the Archer flows through us. While others claim the Great Khān's crown, we claim the unmatched prowess of his most loyal brother, the guardians of his eastern flank"
 mongol_khagan: "Mongol Khāghān"
 mongol_khagan_desc: "Inheritors of the Blue Wolf's decree. As direct descendants of Temujin, our word is the law of the steppe and our mandate is the unification of all who dwell in our great lands."
 seal_of_yuan: "Seal of Great Yuan"
 seal_of_yuan_desc: "A heavy jade testament to a dual destiny. The Mandate of Heaven, fused with the might of the Khāns of the steppe. A claim to the Dragon Throne and the endless plains alike"
 AZOV_WAR: "Azov War"
 tribal_absolute_cognatic_primogeniture: "Absolute Cognatic Primogeniture"

#IO stuff
 KHALKHA_LEADER: "Khān"
 KHORCHIN_LEADER: "Khān"
 OIRAT_LEADER: "Taishi"
 NOGAI_LEADER: "Biy"
 BASHKIR_LEADER: "Tarkhan"
 khalkha_confederation: "Khalkha Ulus"
 khorchin_confederation: "Khorchin Ulus"
 oirat_confederation: "Four Oirats"
 nogai_confederation: "Nogai Confederation"
 bashkir_confederation: "The Bashkiri Confederation"
 khalkha_confederation_desc: "We the 'Heartland' of the Mongol world. We are the noble keepers of the hearth, the direct heirs to the Borjigin line who once held the world in our palms"
 khorchin_confederation_desc: "We the Eastern Guard. Bound by the blood of the legendary archer Khasar, we serve as the staunch protectors of the Mongolian fringes, and the masters of the composite bow"
 oirat_confederation_desc: "We the dwellers of the Forest, turned conquerors. Rejecting the exclusivity of the Golden Lineage we rely on merit, steel, and our fierce spirits of independence from the eastern Khāns"
 nogai_confederation_desc: "The Iron Vanguard of the West, a loose but lethal coalition of nomadic clans, us the Nogai are the masters of the Caspian plains, selling our swords to the highest bidder"
 bashkir_confederation_desc: "Us mountain-dwelling people caught in the crosswinds of history, balancing our ancient steppe traditions against the encroaching shadow of the Western Tsars."
 khalkha_unification_tt: "Gather the banners of the northern hearth to restore the fractured unity of the Borjigin"
 khorchin_unification_tt: "Rally the eastern clans to prove that the line of Khasar is the true master of the steppe"
 nogai_unification_tt: "Consolidate the Manghit clans into a unified force capable of dictating the fate of the Pontic Steppe"
 bashkir_unification_tt: "nd the internal feuds and assert our sovereignty over the valleys of the Urals"
 bashkir_horde_unification_tt: "The splintered tribes are forged anew. No longer a buffer between empires let the Bashkir Khānate rises as the dominant power of the North"
 no_unification_policy: "Loose Confederation"
 no_unification_policy_desc: "Our strength lies in the autonomy of the clans. We ride as brothers, bound by tradition and mutual defense, but beholden to no single master"
 unify_khalkha_policy_desc: "The hearth-fires of the north must burn as one. By gathering the banners of the central clans, we will reclaim our status as the rightful heart of the Mongol world"
 unify_khorchin_policy_desc: "The descendants of the Great Archer shall no longer be divided. We will consolidate the eastern banners to ensure our dominance over the fringes of the steppe"
 unify_oirat_policy_desc: "The Four Oirats must strike as a single fist. Only by binding the Western tribes can we challenge the old dynasties and forge a new meritocratic order"
 unify_nogai_policy_desc: "The Manghit clans are the steel of the Caspian. By unifying the Nogai Horde, we transition from mere mercenaries to the undisputed masters of the western plains."
 unify_bashkir_tribal_policy_desc: "From the valleys of the Ural to the edges of the forest, the Bashkir tribes must speak with one voice to survive the shifting tides of the north"
 unify_bashkir_horde_policy_desc: "No longer shall we be a collection of border tribes. We will forge a centralized state, turning our rugged mountain home into the seat of a new northern Khānate"
 unify_khalkha_policy: "Unity of the Khalkha"
 unify_khorchin_policy: "Unity of the Khorchin"
 unify_oirat_policy: "Unity of the Four Oirats"
 unify_nogai_policy: "Unity of the Nogai"
 unify_bashkir_tribal_policy: "Unity of the Bashkir"
 unify_bashkir_horde_policy: "A Bashkiri Khānate"
 confederation_unification_law: "Unification of the Tribes"
 confederation_unification_law_desc: "At long last, we may unite the tribes of our people into a single nation, under a single ruler"
 diplomatic_status_bashkir_confederation_name: "The Bashkiri Confederation"
 diplomatic_status_bashkir_confederation_tooltip: "We are a resilient brotherhood of clans carved into the valleys of the Southern Urals. Bound by ancestral tradition and a shared oath of defense, we stand united against any who would tread upon our mountain home"
 bashkir_confederation_list_who_tt: "Our Confederation is comprised of the following brother-clans:"
 diplomatic_status_khalkha_confederation_name: "Khalkha Ulus"
 diplomatic_status_khalkha_confederation_tooltip: "We represent the heart of the Mongol world. Through the union of the Inner and Outer Banners, we uphold the sacred military codes and common heritage that have defined the steppe since the age of the Great Khān"
 khalkha_confederation_list_who_tt: "The following nations serve within the Banners of the Khalkha Ulus:"
 diplomatic_status_khorchin_confederation_name: "Khorchin Ulus"
 diplomatic_status_khorchin_confederation_tooltip: "Born of the blood of Khasar the Archer, we are a brotherhood of warriors dedicated to ruling the eastern frontiers. We stand as the impenetrable shield of the steppe, joined by oath and arrow"
 khorchin_confederation_list_who_tt: "The following nations ride with the Khorchin Ulus:"
 diplomatic_status_nogai_confederation_name: "Nogai Confederation"
 diplomatic_status_nogai_confederation_tooltip: "We are the masters of the Pontic-Caspian plains. Our web of tribes serves as an iron wall against the fading empires of the west, leveraging our martial might to dictate the fate of the central steppe"
 nogai_confederation_list_who_tt: "The following nations are bound to the Nogai Confederation:"
 diplomatic_status_oirat_confederation_name: "Four Oirats"
 diplomatic_status_oirat_confederation_tooltip: "We are the Dörben Oirat. Governed by our own council of Khāns, we stand apart to preserve the purity of Western Mongol traditions and the independence of the forest-born tribes"
 oirat_confederation_list_who_tt: "The following nations form the collective of the Four Oirats:"
 io_opinion_bashkir_confederation: "We are brothers of the Ural Covenant"
 io_opinion_khalkha_confederation: "We serve together under the Banners of the Heartland"
 io_opinion_nogai_confederation: "We are kin of the Manghit Yurt"
 io_opinion_oirat_confederation: "We stand as one among the Four Oirats"
 io_opinion_khorchin_confederation: "We share the legacy of the Great Archer's blood"
 io_opinion_khalkha_confederation: "We stand together in the heart of Mongolian legitimency"
 SHARED_MONGOL_HERITAGE: "The Blue Wolf is our common ancestor"
 mongol_local_administration: "Local Administration"
 mongol_local_administration_desc: "How we manage the daily affairs of our grazing lands and settled outposts"
 mongol_tax_obligations: "Tax Obligations"
 mongol_tax_obligations_desc: "The quota of livestock, silver, and tribute owed to support the greater realm"
 mongol_court_etiquette: "Court Etiquette"
 mongol_court_etiquette_desc: "The protocols of the Orda, defining how a subject must approach the Khān’s presence"
 mongol_formal_script: "Formal Script"
 mongol_formal_script_desc: "The use of the vertical script to codify our decrees and preserve our history"
 mongol_legal_framework: "Legal Framework"
 mongol_legal_framework_desc: "Our adherence to the Great Yassa and the traditional laws of the steppe"
 mongol_economic_framework: "Economic Framework"
 mongol_economic_framework_desc: "The regulation of our markets and the standardization of currency across the confederation"
 mongol_trade_relations: "Trade Relations"
 mongol_trade_relations_desc: "Our standing with the merchant caravans and the security of the routes through our territory"
 mongol_clan_diplomacy: "Clan Diplomacy"
 mongol_clan_diplomacy_desc: "The delicate art of balancing the rivalries and alliances of the noble houses"
 mongol_tribal_administration_policy: "Tribal Administration"
 mongol_sinicized_administration_policy: "Sinicized Administration"
 mongol_no_tax_obligations_policy: "No Tax Obligations"
 mongol_fair_tax_obligations_policy: "Fair Tax Obligations"
 mongol_extensive_tax_obligations_policy: "Extensive Tax Obligations"
 mongol_no_court_etiquette_policy: "No Court Etiquette"
 mongol_basic_court_etiquette_policy: "Basic Court Etiquette"
 mongol_sinicized_court_etiquette_policy: "Sinicized Court Etiquette"
 mongol_mongol_script_policy: "Traditional Mongol Script"
 mongol_sinicized_script_policy: "Sinicized Script"
 mongol_no_legal_framework_policy: "Customary Tribal Law"
 mongol_basic_legal_framework_policy: "Basic Legal Framework"
 mongol_sinicized_legal_framework_policy: "Imperial Legal Code"
 mongol_shared_crops_policy: "Shared Tribal Crops"
 mongol_decentralized_farming_villages: "Decentralized Farming"
 mongol_financed_rgo_policy: "State-Financed RGOs"
 mongol_clan_trade_only_policy: "Inter-Clan Trade"
 mongol_allow_foreign_exchanges_policy: "Open Foreign Exchange"
 mongol_chinese_tribute_policy: "Tributary Trade System"
 mongol_no_embassies_policy: "Isolationist Diplomacy"
 mongol_clan_embassies_policy: "Inter-Confederation Embassies"
 mongol_chinese_embassies_policy: "Imperial Embassies"
 mongol_tribal_administration_policy_desc: "Power is vested in the Khāns and local chieftains. While this maintains the loyalty of the steppe, it lacks the nuance required to govern dense urban populations"
 mongol_sinicized_administration_policy_desc: "By adopting the bureaucratic structures of the Middle Kingdom, we utilize a hierarchy of scholars to maximize state control and stability"
 mongol_no_legal_framework_policy_desc: "Governance is handled through the Yassa and oral tradition. Justice is swift, personal, and dictated by the immediate will of the leader"
 mongol_basic_legal_framework_policy_desc: "A hybrid system that codifies essential steppe laws while introducing written statutes to resolve disputes in sedentary territories"
 mongol_sinicized_legal_framework_policy_desc: "Implementation of a rigorous, Confucian-inspired legal code, prioritizing social order and institutionalized civil litigation"
 mongol_no_tax_obligations_policy_desc: "The state survives on plunder and tribute. This keeps the nomadic heartlands happy but leaves the treasury empty during times of peace"
 mongol_fair_tax_obligations_policy_desc: "A balanced approach to extraction that ensures the state is funded without triggering peasant revolts or stifling local growth"
 mongol_extensive_tax_obligations_policy_desc: "Aggressive tax farming and heavy levies. This provides immense short-term wealth but risks long-term economic collapse and unrest"
 mongol_shared_crops_policy_desc: "Tribal communities manage agricultural output collectively, ensuring the horde is fed before any surplus is traded"
 mongol_decentralized_farming_villages_desc: "Agrarian communities are left to their own devices, paying a portion of their yield to local lords in exchange for protection"
 mongol_financed_rgo_policy_desc: "Direct state investment into resource gathering. The empire builds the infrastructure and claims the lion's share of the output"
 mongol_clan_trade_only_policy_desc: "Restricts commerce to internal exchanges between loyal clans, preventing foreign influence from diluting Mongol culture"
 mongol_allow_foreign_exchanges_policy_desc: "Encourages the movement of merchants across the Silk Road, taxing the flow of exotic goods and ideas from West to East"
 mongol_chinese_tribute_policy_desc: "Establishes a system where foreign powers must acknowledge the Great Khān’s supremacy through ritual gifts in exchange for trading rights"
 mongol_no_embassies_policy_desc: "The Mongol state communicates only through ultimatums. Foreign envoys are viewed with suspicion or as mere messengers"
 mongol_clan_embassies_policy_desc: "Focuses on maintaining the delicate balance of power between the various branches of the Borjigin family and allied tribes"
 mongol_chinese_embassies_policy_desc: "Establishes formal diplomatic missions and permanent residencies for foreign dignitaries, mirroring the foreign policy of a sedentary Empire"
 mongol_no_court_etiquette_policy_desc: "The Khān is a 'first among equals.' The court is informal and centered around personal merit and martial prowess"
 mongol_basic_court_etiquette_policy_desc: "Introduces necessary protocols to ensure the Khān’s dignity when dealing with both nomadic lords and settled subjects"
 mongol_sinicized_court_etiquette_policy_desc: "Implements the elaborate rituals and prostrations of the Imperial court, elevating the Khān to the status of the Son of Heaven"
 mongol_mongol_script_policy_desc: "Promotes the use of the vertical Uyghur-derived script to maintain a distinct Mongol identity in official records"
 mongol_sinicized_script_policy_desc: "Adopts Chinese characters for statecraft, facilitating communication with the massive Han bureaucracy and scholar-gentry"
 kurultai_election: "Kurultai Election"
 kurultai_election_desc: "The hearth of the empire has grown cold, and the White Felt is vacant. The princes, generals, and chieftains of the blood must gather to debate the merit of the claimants. Only one can be raised by the assembly to lead the horde; until the banners are raised for a new master, the steppe remains in shadow"
