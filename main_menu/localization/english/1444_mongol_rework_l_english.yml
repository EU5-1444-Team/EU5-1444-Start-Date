 mongol_tribal_administration_policy_desc: "Power is vested in the Khans and local chieftains. While this maintains the loyalty of the steppe, it lacks the nuance required to govern dense urban populations."
 mongol_sinicized_administration_policy_desc: "By adopting the bureaucratic structures of the Middle Kingdom, we utilize a hierarchy of scholars to maximize state control and stability."
 mongol_no_legal_framework_policy_desc: "Governance is handled through the Yassa and oral tradition. Justice is swift, personal, and dictated by the immediate will of the leader."
 mongol_basic_legal_framework_policy_desc: "A hybrid system that codifies essential steppe laws while introducing written statutes to resolve disputes in sedentary territories."
 mongol_sinicized_legal_framework_policy_desc: "Implementation of a rigorous, Confucian-inspired legal code, prioritizing social order and institutionalized civil litigation."
 mongol_no_tax_obligations_policy_desc: "The state survives on plunder and tribute. This keeps the nomadic heartlands happy but leaves the treasury empty during times of peace."
 mongol_fair_tax_obligations_policy_desc: "A balanced approach to extraction that ensures the state is funded without triggering peasant revolts or stifling local growth."
 mongol_extensive_tax_obligations_policy_desc: "Aggressive tax farming and heavy levies. This provides immense short-term wealth but risks long-term economic collapse and unrest."
 mongol_shared_crops_policy_desc: "Tribal communities manage agricultural output collectively, ensuring the horde is fed before any surplus is traded."
 mongol_decentralized_farming_villages_desc: "Agrarian communities are left to their own devices, paying a portion of their yield to local lords in exchange for protection."
 mongol_financed_rgo_policy_desc: "Direct state investment into resource gathering. The empire builds the infrastructure and claims the lion's share of the output."
 mongol_clan_trade_only_policy_desc: "Restricts commerce to internal exchanges between loyal clans, preventing foreign influence from diluting Mongol culture."
 mongol_allow_foreign_exchanges_policy_desc: "Encourages the movement of merchants across the Silk Road, taxing the flow of exotic goods and ideas from West to East."
 mongol_chinese_tribute_policy_desc: "Establishes a system where foreign powers must acknowledge the Great Khan’s supremacy through ritual gifts in exchange for trading rights."
 mongol_no_embassies_policy_desc: "The Mongol state communicates only through ultimatums. Foreign envoys are viewed with suspicion or as mere messengers."
 mongol_clan_embassies_policy_desc: "Focuses on maintaining the delicate balance of power between the various branches of the Borjigin family and allied tribes."
 mongol_chinese_embassies_policy_desc: "Establishes formal diplomatic missions and permanent residencies for foreign dignitaries, mirroring the foreign policy of a sedentary Empire."
 mongol_no_court_etiquette_policy_desc: "The Khan is a 'first among equals.' The court is informal and centered around personal merit and martial prowess."
 mongol_basic_court_etiquette_policy_desc: "Introduces necessary protocols to ensure the Khan’s dignity when dealing with both nomadic lords and settled subjects."
 mongol_sinicized_court_etiquette_policy_desc: "Implements the elaborate rituals and prostrations of the Imperial court, elevating the Khan to the status of the Son of Heaven."
 mongol_mongol_script_policy_desc: "Promotes the use of the vertical Uyghur-derived script to maintain a distinct Mongol identity in official records."
 mongol_sinicized_script_policy_desc: "Adopts Chinese characters for statecraft, facilitating communication with the massive Han bureaucracy and scholar-gentry."

