 northern_yuan_legacy_modifier_desc: "With the Mongolian Steppe finally unified under us, the dream of reclaiming the Great Yuan has never been closer to reality"

#Events
 tatar_yoke_events.1.title: "Great Stand on the Ugra River"
 tatar_yoke_events.1.desc_horde: "The winter winds of [GetCurrentYear] carry the scent of a fading era. Across the freezing waters of the Ugra, the armies of [ugra_rus_prince.GetGovernment.GetRuler.GetName] stood their ground, refusing to bow or pay the customary silver. Despite our martial heritage, the momentum of the Great Ulus has faltered. [ugra_horde_leader.GetGovernment.GetRuler.GetName] has ordered the retreat south. The 'Tatar Yoke' is broken, the vassals of the north no longer fear the shadow of our banners"
 tatar_yoke_events.1.desc_rus: "For generations, we have lived under the shadow of Sarai, but today that shadow recedes. In [GetCurrentYear], the forces of [ugra_horde_leader.GetName] faced us across the Ugra River, but they found no fear in our ranks. Seeing our resolve, [ugra_horde_leader.GetGovernment.GetRuler.GetName] turned back without a fight. The long night of the Mongol tribute has ended. The Princes of Rus are masters of their own destiny once more"
 tatar_yoke_events.1.a_rus: "The Yoke is broken! Glory to the Rus!"
 tatar_yoke_events.1.a_horde: "The sun sets on the Ulus of Batu and Jochi"
 northern_yuan.200.title: "Reorganization of the Uriankhai"
 northern_yuan.200.desc: "Deep within the northern taiga, the Uriankhai tribes have long served as the silent sentinels of our ancestors' final resting places. Yet, their independence has become a source of instability, their tumens scattered like leaves in the wind. To secure the northern flank and honor the sacred burial grounds, the Khāghān has decreed that their disparate banners be unified into a single, disciplined force. No longer shall they roam as fragmented clans, from this day they ride as the iron vanguard of the Imperial North"
 northern_yuan.200.a: "One people, one banner, one Khāghān"
 northern_yuan.200.ctt: "We the Uriankhai bow to the Imperial Decree"
 northern_yuan.100.title: "The Submission of Mongolia"
 northern_yuan.100.desc: "The era of the squabbling clans has reached its sunset. From our seat in the Ordo, we look upon a steppe that once again fears our name and respects our mandate. The time for subtle diplomacy is over. We shall send the white banners to every corner of the horizon, demanding that the Khāns of the steppe acknowledge their master. Today, we do not just rule a tribe, we reclaim a nation. Let Mongolia be one, or let it be ash"
 northern_yuan.100.a: "They shall kneel before the White Felt"
 northern_yuan.100.ctt: "An ultimatum is sent to every clan to acknowledge the Khāghān, or face our wrath"
 northern_yuan.101.title: "The Shadow of the White Banner"
 northern_yuan.101.desc: "Dust rises on the horizon as the envoys of the Northern Yuan enter our camp. They bring no gifts, only a demand: that we lay down our independent standards and swear absolute fealty to the Great Khāghān. They speak of a restored empire and a unified destiny, but their words carry the heavy weight of steel. We stand at a crossroads—to become a branch of a mighty tree, or to stand alone against the coming storm"
 northern_yuan.101.a: "The Mandate is clear. We submit to the Yuan"
 northern_yuan.101.b: "We are the children of the steppe! We bow to no one!"
 northern_yuan.102.title: "The Restoration of the Great Yuan"
 northern_yuan.102.desc: "The long retreat is over. For the first time since the treachery at Dadu and the loss of the Middle Kingdom, the Great Yuan stands unified and unbroken. We have gathered the scattered jade and mended the Imperial Seal. The tribes of the north are no longer a collection of nomads, but the vanguard of a dynasty. Once again, the world shall tremble as we prepare, to ride south and reclaim what is ours by divine right"
 northern_yuan.102.a: "Let the Dragon and the Wolf be one!"
 northern_yuan.102.ctt: "Every loyal clan is formally integrated into the administrative hierarchy of the restored Yuan Empire"
 northern_yuan.103.title: "One Under the Yuan"
 northern_yuan.103.desc: "TThe Great Khāghān has succeeded where generations before him failed. The Yuan Empire is restored, and the call for total integration has reached our camp. We are no longer a free tribe of the steppe, but the foundation of an Imperial restoration. Our destinies are now bound to the Dragon Throne"
 northern_yuan.103.a: "We are the steel of the Emperor."
 northern_yuan.104.title: "The Birth of the Mongolian Nation"
 northern_yuan.104.desc: "The shadows of the past have been cast aside. We no longer look south to the palaces of the Han, nor do we cling to the ghosts of dead dynasties. Today, we forge something entirely new: a singular, sovereign Mongolian state. The tribes are bound not by imperial decree, but by the shared blood and fire of the steppe. Under our banner, we stand unified—a nation of warriors ready to face whatever the future holds as masters of our own horizon"
 northern_yuan.104.a: "A new age for the Blue Wolf!"
 northern_yuan.104.ctt: "Every clan is unified into a singular, centralized Mongolian state"
 northern_yuan.105.title: "The Great Mongol Union"
 northern_yuan.105.desc: "The age of division has ended. The unification of our people is complete, and we are called to join the new Mongolian state. We shed our old tribal rivalries to become part of a singular nation, standing together as brothers under the eternal blue sky"
 northern_yuan.105.a: "For the glory of Mongolia!"

