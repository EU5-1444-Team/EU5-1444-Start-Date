 change_yeke_mongghul_ulus_text: "Yeke Mongghul Ulus"
 yuan_tribute_desc: "Tribute paid to the Taishi of the Northern Yuan."
 diplomatic_status_northern_yuan_name: "Northern Yuan"
 diplomatic_status_northern_yuan_tooltip: "We are the Northern Yuan, the legitimate heirs to the Great Khān’s lineage. Though our dominion over the steppe is fractured, the 'Forty and Four' Mongol tribes still look to the Borjigin Khāns for guidance, and for the ultimate dream of reclaiming the Dragon Throne of the Middle Kingdom"
 northern_yuan_list_who_tt: "The following banners and realms swear fealty to the Northern Yuan:"
 io_opinion_northern_yuan: "We both acknowledge the sacred lineage of the Northern Yuan"
 war_goal_seize_yuan_wargoal: "Win Superiority"
 war_goal_seize_yuan_wargoal_desc: "The Mandate of Heaven is not granted by words, but by victory. We must shatter the current Khāghān’s armies to prove our right to rule the Great Yuan"
 war_goal_seize_protector_general_wargoal: "Win Superiority"
 war_goal_seize_protector_general_wargoal_desc: "To rule the Khāghān, one must first master the field. We must crush the Taishi's elite guard to seize the seat of the Protector-General"
 war_goal_northern_yuan_raid_wargoal: "Win Superiority"
 war_goal_northern_yuan_raid_wargoal_desc: "Fight battles to win"
 peace_seize_yuan_entry: "Seize the Imperial Seal"
 peace_seize_yuan_entry_desc: "Force the abidcation of the Khāghān, so we may take his place"
 peace_seize_protector_general_entry: "Claim the Office of Taish"
 peace_seize_protector_general_desc: "Force the transition of the Protector-General's powers to our own house, becoming the true power behind the Yuan throne"
 peace_northern_yuan_raid_entry: "Enforce Tributes and Spoils"
