 centralisation_oirat: "Oirat Centralization"
 centralisation_oirat_desc: "Our state is not of cohesion and unity, but of induvidual clans and strength of arms. If we can not maintain equilibrium between the clans they will scatter into the wind, abandoning us"
 WE_ARE_LOYAL_TO_MING: "We are loyal to Ming"
 oirat_confederation_legacy_modifier: "Oirat Unification"
 oirat_confederation_legacy_modifier_desc: "Reward for a unified Oirat state"
