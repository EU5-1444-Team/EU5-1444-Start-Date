 NOGAI_LEADER_FEMALE: "Mirzayim"
 BASHKIR_LEADER_MALE: "Tarkhan"
 BASHKIR_LEADER_FEMALE: "Tarkhan"
 WE_DONT_WANT_UNIFICATION: "We do not wish for unification"
 oirat_unification_reform: "Oirat Great Confederation"
 oirat_unification_reform_desc: "The disparate tribes of the Oirat have finally merged into a single, centralized entity. By balancing the old laws of the steppe with a new, unified command, we ensure the legacy of the Four Oirat remains eternal."
 eastern_steppe_unification_reform: "Unified Steppe Administration"
 eastern_steppe_unification_reform_desc: "Having brought the eastern tribes under a single banner, we have moved beyond a loose collection of interests into a formalized state capable of projecting power across the silk road."

#Golden Horde
 golden_horde: "Ulug Ulus"
 golden_horde_desc: "The Great State of the West. Though the winds of time have battered our borders, we remain the heirs of Batu and the masters of the Pontic Steppe, ruling from the Volga to the ends of the earth"
 GOLDEN_HORDE_LEADER: "Leader"
 golden_horde_claimant: "Rival of the Blood"
 golden_horde_claimant_desc: "One who shares the lineage of Jochi and seeks to seize the White House of Sarai"
 we_were_not_forced_to_renounce_khan_claim_tt: "The path to Sarai remains open; we have not yet been broken or forced to abandon our birthright"
 cb_unify_golden_horde: "Golden Horde Unification"
 war_goal_unify_golden_horde_wargoal: "Show Superiority"
 cb_false_golden_horde_claimant: "Depose the False Pretender"
 war_goal_false_golden_horde_claimant_wargoal: "Show Superiority"
 war_goal_false_golden_horde_claimant_wargoal_desc: "Wargoal is to win battles"
 war_goal_unify_golden_horde_wargoal_desc: "Wargoal is to win battles"
 UNIFY_GOLDEN_HORDE_WAR_NAME: "Unification of the Golden Horde"
 FALSE_GOLDEN_HORDE_CLAIMANT_WAR_NAME: "Elimination of Rival Claimant"
 claim_golden_horde: "Claim Golden Horde Leadership"
 claim_golden_horde_desc: "We will formally declare our intent to seize the throne of the Ulug Ulus, calling upon all loyal clans to abandon the current Khagan and ride with the true heir"
 peace_force_renounce_golden_horde_claim: "Force renouncement"
 peace_force_renounce_golden_horde_claim_desc: "The defeated shall publicly renounce any and all claims to the throne of Jochi, acknowledging their place as a mere subject"
 cb_unify_golden_horde: "Unify horde"
 cb_unify_golden_horde_desc: "Unite the Golden Horde"
 GOLDEN_HORDE_LEADER_MALE: "Khāghān"
 GOLDEN_HORDE_LEADER_FEMALE: "Khātūn"
 diplomatic_status_golden_horde_name: "The Golden Horde"
 diplomatic_status_golden_horde_tooltip: "We are the Ulug Ulus, the supreme authority of the House of Batu. Our subjects are bound by the 'Tatar Yoke'—a sacred and iron-clad obligation to provide the blood of their sons for our armies and the gold of their treasuries for our throne"
 golden_horde_list_who_tt: "The following realms acknowledge the legacy of Sarai, and serve under the Tatar Yoke:"
 io_opinion_golden_horde: "We both serve the Great Khāghān of the Ulug Ulus"
 peace_force_renounce_golden_horde_claim_entry: "Renounce claim to Golden Horde"
 cb_false_golden_horde_claimant_desc: "Force them to relinquish their claim to the Golden Horde"

#Tatar Yoke
 enforce_tatar_yoke_wargoal: "Enforce the Tatar Yoke"
 enforce_tatar_yoke_wargoal_desc: "This realm has forgotten the shadow of our banners. We shall ride to their gates to remind them that their peace is a gift from the Khāghān. One that must be paid for in gold and blood"
 ENFORCE_TATAR_YOKE_WAR_NAME: "War of Subjugation"
 peace_enforce_tatar_yoke: "Enforce the Tatar Yoke"
 peace_enforce_tatar_yoke_desc: "We do not seek their lands, but their souls and their treasuries. By crushing their armies in the field, we prove that resistance is a death sentence"
 cb_enforce_tatar_yoke: "Enforce the Tatar Yoke"
 cb_enforce_tatar_yoke_desc: "The defeated shall bow. Henceforth, they are our vassals. They will provide a census for our taxes, tribute for our courts, and warriors for our vanguard. Their sovereignty ends where our mandate begins"
 war_goal_enforce_tatar_yoke_wargoal: "Show Superiority"
 war_goal_enforce_tatar_yoke_wargoal_desc: "Wargoal is to win battles"

#Northern Yuan
 northern_yuan: "Northern Yuan"
 northern_yuan_desc: "The Dragon’s retreat. Driven from the palaces of Khanbaliq but clutching the Great Seal, we remain the rightful Emperors of the North. Our throne is a saddle, and our palace is the open steppe, yet our mandate remains unbroken"
 NORTHERN_YUAN_LEADER: "Khāghān"
 yeke_mongghul_ulus: "The Great Mongol Authority"
 yeke_mongghul_ulus_desc: "Our standing among the fractured tribes. This prestige represents our ability to command the 'Yeke Mongghul Ulus.' With enough respect, we can silence the squabbling clans, codify new laws, and finally weld the shattered steppe back into a singular, world-conquering force"
 NORTHERN_YUAN_LEADER_MALE: "Khāghān"
 NORTHERN_YUAN_LEADER_FEMALE: "Khātūn"
 yuan_holder: "Khāghān"
 yuan_holder_desc: "The Son of Heaven in exile. As the holder of the Yuan title, we are the bridge between the glory of the Mongol World Empire and the ancestral heartland of the Borjigin"
 protector_general: "Taishi"
 protector_general_desc: "The Iron Hand behind the Throne. While the Khāghān holds the title, the Taishi commands the swords. We are the architects of the empire’s survival—and its true master in all but name"
 YEKE_MONGGHUL_ULUS_DISPLAY: "Imperial Mandate: $VAL$"
 cb_seize_yuan: "Claim the Imperial Mandate"
 cb_seize_yuan_desc: "The current occupant of the throne is a shadow of the Great Khāns. It is time for a stronger branch of the lineage to take up the Seal and lead the Northern Yuan back to greatness"
 cb_seize_protector_general: "The Fall of the Puppeteer"
 cb_seize_protector_general_desc: "The Taishi has overstepped his bounds, treating the Khāghān as a mere ornament. We must ride to court and strike down this usurper to restore the true balance of power-or claim it for our own"
 cb_northern_yuan_raid: "Mongol Raid"
 cb_northern_yuan_raid_desc: "The Khāghān’s decree is a whisper in the wind. Since the central court can no longer protect its borders or command respect, we shall take what we desire by right of the blade"
 SEIZE_YUAN_WAR_NAME: "The Struggle for the Imperial Seal"
 SEIZE_PROTECTOR_GENERAL_WAR_NAME: "The Struggle for the Position of Taishi"
 NORTHERN_YUAN_RAID_WAR_NAME: "Raid"
 kurultai_law: "Laws of the Kurultai"
 kurultai_law_desc: "The heartbeat of the steppe. In this great assembly, the fate of the Ulus is weighed by the princes and chieftains. Here, the Khān's right to lead is either affirmed by the raising of the felt, or contested by the sharpening of blades"
 tribute_system_law: "Systems of Tribute"
 tribute_system_law_desc: "The vertical thread of power. We must define exactly what the local lords owe to the center—be it the fruits of the hunt, the silver of the silk road, or the life-blood of their sons"
 pasture_rights_law: "Nutag Grazing Rights"
 pasture_rights_law_desc: "The nutag is the soul of the nomad. By codifying who controls the ancestral pastures, we control the migration of the clans and, by extension, their loyalty"
 military_organization_law: "Tümen Organization"
 military_organization_law_desc: "The confederation is only as strong as the armies it can field. How we fight, and who commands"
 imperial_court_law: "Ordo Law"
 imperial_court_law_desc: "The character of the great court shapes the character of the Ulus. Tradition or transformation — we cannot have both"
 vassal_obligations_law: "Törü Obligations"
 vassal_obligations_law_desc: "Law and custom bind the khans to us. How tightly those bonds are drawn is the question"
 imperial_authority_law: "Yeke Törü"
 imperial_authority_law_desc: "For the first time in an age, a single will governs the horizon. The 'Great Law' is ours to write, shifting the foundation of the world from the chaos of tribes to the order of the state"
 mongol_consolidation_law: "Nigen Üge"
 mongol_consolidation_law_desc: "One word. One command. One destiny. We are moving beyond the era of 'Many Khāns' toward a future where the tribes speak with a single, thunderous voice"
 yuan_consolidation_law: "Restoration of Great Yuan"
 yuan_consolidation_law_desc: "The banners return to the south. We breathe life back into the institutions of Kublai, mending the fractured jade of the empire. What was broken in the retreat shall be made whole under the Dragon Throne"
 mongolia_consolidation_law: "Yeke Mongghul Ulus"
 mongolia_consolidation_law_desc: "We do not seek to live in the shadow of the past or the palaces of the Han. This is a rebirth of the Mongol Nation—a unified, singular entity forged in the fires of the steppe, beholden only to the Blue Sky"
 loose_acknowledgment_policy: "Loose Acknowledgment"
 loose_acknowledgment_policy_desc: "We accept the title of 'First Among Equals.' It is a gesture of respect offered by the clans in exchange for their total autonomy. We rule in name; they rule in deed"
 formal_kurultai_policy: "Formal Kurultai"
 formal_kurultai_policy_desc: "The assembly is no longer a chaotic gathering, but a structured pillar of the state. We preside as the ultimate arbiter, transforming the raw energy of the tribes into the organized momentum of an empire"
 military_tribute_policy: "Military Tribute"
 military_tribute_policy_desc: "We care nothing for coin. The khans must provide horses, men, and steel. When the Khān rides, the clans must follow; their tribute is measured in the length of their vanguards"
 standardized_tribute_policy: "Standardized Tribute"
 standardized_tribute_policy_desc: "The era of discretionary 'gifts' has ended. The census has been taken, the quotas are fixed, and our agents now collect the state’s due with the cold efficiency of a true imperial power"
 traditional_territories_policy: "Traditional Territories"
 traditional_territories_policy_desc: "We guarantee the ancestral pastures of each clan against all intruders. By freezing the borders of the nutag, we buy a lasting peace—turning the warriors' gaze outward instead of toward each other"
 yuan_arbitration_policy: "Yuan Arbitration"
 yuan_arbitration_policy_desc: "Disputes over land and water are no longer settled with the bow. Every grievance flows to the Emperor’s court, where our word is final. Private warfare between the clans is a crime against the throne"
 yuan_offensive_call_policy: "The Conqueror's Call"
 yuan_offensive_call_policy_desc: "When the Khān calls, the clans must answer. We do not ride merely to defend our current pastures, but to trample new ones beneath our hooves"
 standardized_tumen_policy: "Standardized Tumens"
 standardized_tumen_policy_desc: "TThe decimal system of Chinggis Khān, restored to its former glory. We have broken the irregular clan levies; now, every Tumen answers only to the central command of the Great Mongol State"
 traditional_mongol_court_policy: "Traditional Court"
 traditional_mongol_court_policy_desc: "The Yassa is our only guide. We reject the soft rituals of the south in favor of the old ways. The court of the Khān is a court of the steppe—where merit, loyalty, and the hunt define a man’s worth"
 sinicized_court_policy: "Sinicized Court"
 sinicized_court_policy_desc: "Confucian order replaces tribal whim. The Ordo is transformed into a hall of scholars and ritual, where the Khān is elevated as the Son of Heaven and the tribes are treated as subjects of a celestial bureaucracy"
 military_subjugation_policy: "Military Subjugation"
 military_subjugation_policy_desc: "Garrisons are placed. Rivals are disarmed. The khans are vassals in more than name"
 administrative_integration_policy: "Prefecture Integration"
 administrative_integration_policy_desc: "The era of the tribes gives way to the era of the state. Hereditary chiefs are replaced by loyal appointees, and the wild grazing lands are mapped into prefectures. The Ulus is no longer a collection of people, but a unified machine"
 mongol_imperial_authority_policy: "Mongol Authority"
 mongol_imperial_authority_policy_desc: "The Khāghān's word is the only law on the steppe. The age of divided loyalties is over"
 yuan_imperial_authority_policy: "Yuan Authority"
 yuan_imperial_authority_policy_desc: "Our edicts supersede all custom, all tradition, and all ancestral right. There is but one law in the world, and it flows directly from the throne to the furthest corner of the steppe"
 puppet_all_mongols_policy: "Subjugation of the Chieftains"
 puppet_all_mongols_policy_desc: "The great khans of the sub-tribes are reduced to mere figureheads, ceremonial relics of a divided age. Power has flowed to the center, and the center shall never let it go again"
 annex_all_mongols_yuan_policy: "Reformation of the Great Yuan"
 annex_all_mongols_yuan_policy_desc: "The Great Yuan is reborn in its full, terrible majesty. We have reclaimed the Mandate of Heaven, turning the nomad’s mobility into the bedrock of a permanent, eternal dynasty"
 annex_all_mongols_mongolia_policy: "Unification of Mongolia"
 annex_all_mongols_mongolia_policy_desc: "Not a restoration of what was, but something new. Mongolia, free of our imperial past, united at last"
 preserve_northern_yuan_policy: "Preserve the Ulus"
 preserve_northern_yuan_policy_desc: "The Northern Yuan endures. The current balance between the court and the clans is delicate; this is not the moment for reckless change"
 preserve_yuan_policy: "The Enduring Dynasty"
 preserve_yuan_policy_desc: "The dynasty stands as it has for generations. We choose stability over ambition, let others exhaust themselves making history"
 preserve_mongolia_policy: "The Eternal Nation"
 preserve_mongolia_policy_desc: "The nation endures, and that is victory enough. We will protect what we have and leave the grand dreams of empire to the ghosts"
 peace_seize_yuan: "Seize the Dragon Throne"
 peace_seize_yuan_desc: "The Imperial Seal changes hands. We formally press our claim to the Yuan Dynasty, taking up the mantle of the Great Khān and the legacy of the Middle Kingdom"
 peace_seize_protector_general: "Seize the Taishi"
 peace_seize_protector_general_desc: "The puppeteer has been unmasked. We wrest the title of Protector-General from our rival, placing the Khāghān under our 'protection' and assuming total command of the state’s military"
 peace_northern_yuan_raid: "Raid Tribute"
 peace_northern_yuan_raid_desc: "The central court is weak, unable to project their will over us. We take by the blade what the Khāghān refused to give by decree, reminding the capital of the true power of the frontier"
 special_status_var_greater_or_equal: "The Taishi must command at least 80 Khāghān Authority to enact this measure"
 yuan_tribute: "Imperial Tribute"
 yuan_tribute_price: "The Cost of Protection"
 northern_yuan_list: "Northern Yuan"
 claim_protector_general: "Reclaim the Mantle of Taishi"
 claim_protector_general_desc: "The office of Protector-General is our ancestral right. We shall restore the power of the Taishi to guide the empire through these dark times"
 unite_uriankhai: "Unite the Uriankhai"
 unite_uriankhai_desc: "The Uriankhai, the clans of the Northern Forests, and guardians of the Great Taboo, must be brought back into the fold to protect the sacred lands of our ancestors"
 opinion_added_land_to_northern_yuan: "Added Land to Northern Yuan"
 opinion_removed_land_from_northern_yuan: "Removed Land from Northern Yuan"
 opinion_northern_yuan_reform_passed: "Yuan Reform Passed"
