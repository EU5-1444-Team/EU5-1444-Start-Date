#Events
 tatar_yoke_events.1.title: "Great Stand on the Ugra River"
 tatar_yoke_events.1.desc_rus: "In [GetCurrentYear] the forces of [scope:ugra_rus_prince.GetName], led by [scope:ugra_rus_prince.GetRuler.GetName], and [scope:ugra_horde_leader.GetRuler.GetName] of [scope:ugra_horde_leader.GetName] stared at each other across the Ugra River. Eventually [scope:ugra_horde_leader.GetRuler.GetName] relented, retreating south, and abandoning [scope:ugra_horde_leader.GetRuler.GetHisHer] claims and tribute from the Rus Principalities."
 tatar_yoke_events.1.desc_horde: "In [GetCurrentYear] the forces of [scope:ugra_rus_prince.GetName], led by [scope:ugra_rus_prince.GetRuler.GetName], and [scope:ugra_horde_leader.GetRuler.GetName] of [scope:ugra_horde_leader.GetName] stared at each other across the Ugra River. Eventually [scope:ugra_horde_leader.GetRuler.GetName] relented, retreating south, and abandoning [scope:ugra_horde_leader.GetRuler.GetHisHer] claims and tribute from the Rus Principalities."
 tatar_yoke_events.1.a_rus: "The lands of the Rus are Free!"
 tatar_yoke_events.1.a_horde: "A dark day for the Steppe."
 northern_yuan.200.title: "Reorganization of the Uriankhai"
 northern_yuan.200.desc: "The Uriankhai tribes, long-standing guardians of the Taiga North and the Imperial Burial Grounds, are disunited and independent. To ensure their continued support of his policies, the Khagan has decreed a systematic unification of their tumens."
 northern_yuan.200.a: "Reorganization of the Uriankhai"
 northern_yuan.200.ctt: "As the Khagan decrees"
 northern_yuan.100.title: "The Khan Demands Submission"
 northern_yuan.100.desc: "The time has come to assert our dominance over the Mongol clans. We shall demand their submission and restore the glory of the Yuan."
 northern_yuan.100.a: "Let them kneel before us."
 northern_yuan.100.ctt: "Every clan that has not yet submitted will be called upon to do so."
 northern_yuan.101.title: "The Yuan Demands Our Submission"
 northern_yuan.101.desc: "The Emperor of the Northern Yuan has sent envoys demanding we submit to their authority. We must decide how to respond."
 northern_yuan.101.a: "We submit to the Yuan."
 northern_yuan.101.b: "We refuse to submit."
 northern_yuan.102.title: "The Yuan is Restored"
 northern_yuan.102.desc: "The moment has come. The Yuan dynasty shall be restored in its full glory, and the Mongol tribes shall be united under our banner once more."
 northern_yuan.102.a: "Let the Yuan rise again!"
 northern_yuan.102.ctt: "Every clan will be annexed into the restored Yuan Empire."
 northern_yuan.103.title: "Absorbed into the Yuan"
 northern_yuan.103.desc: "The Yuan Emperor has restored the dynasty. Our people are to be absorbed into the new empire."
 northern_yuan.103.a: "We are one with the Yuan."
 northern_yuan.104.title: "Mongolia United"
 northern_yuan.104.desc: "The time has come to forge a new Mongolian nation, free from the shackles of the past. The tribes shall be united under a single banner."
 northern_yuan.104.a: "A new Mongolia rises!"
 northern_yuan.104.ctt: "Every clan will be annexed into the new Mongolian state."
 northern_yuan.105.title: "Absorbed into Mongolia"
 northern_yuan.105.desc: "The great unification has come. Our people are to be absorbed into the new Mongolian state."
 northern_yuan.105.a: "We are one with Mongolia."

