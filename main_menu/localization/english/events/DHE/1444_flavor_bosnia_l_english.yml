l_english:
  1444_flavor_bosnia.1.title: "A Matter of the Heart and the Crown"
  1444_flavor_bosnia.1.desc: "Whispers coil through the halls of Bobovac. Many among the magnates still look upon [GetCharacter('bos_vojaca').GetName] as unworthy of a queen, and their discontent weighs upon the throne. Yet beyond pride lies opportunity: a union with the house of Kosača could quiet the lords and draw Hum nearer to our side. The choice now rests with [GetCharacter('bos_thomas_kotromanic').GetName] — to put aside the woman who has stood beside him, and take the hand of [GetCharacter('hum_catherine_of_bosnia').GetName] instead."
  1444_flavor_bosnia.1.a: "The realm must come before affection. Wed Catherine."
  1444_flavor_bosnia.1.b: "I will not cast aside a loyal wife."