l_english:
 flavor_bsh.50.title: "A Nation Reborn"
 flavor_bsh.50.desc: "The tribes have united under a single banner — the scattered clans of the Ural mountains and the Belaya river valleys now ride as one people. But what kind of nation shall we be? The old ways of the confederation served us well, binding the tribes together through custom and consent. Yet there are those who argue that the age of khans has come — that only a strong ruler on a golden throne can hold what we have won and reach for more"
 flavor_bsh.50.a: "We are Bashkir. Our strength is in our tribes, our customs. Let the confederation endure"
 flavor_bsh.50.b: "The age of khans is upon us. Let Bashkiria dominate the steppe."

 flavor_steppe.1.title: "Victory in the Civil War"
 flavor_steppe.1.desc: "After a grueling and bitter conflict, the fractures within the Great Horde have finally been mended. The pretenders have been crushed, and our rule is undisputed. Now, we must now decide to return to Sarai, or maintain our current court where our victory was forged."
 flavor_steppe.1.a: "Let us return to Sarai."
 flavor_steppe.1.b: "Remain in our current location."

 flavor_steppe.2.title: "Ahmed's Coup"
 flavor_steppe.2.desc: "Tensions within the court have reached a boiling point.  Ahmed, emboldened by factions among the nobility, has launched a coup to overthrow his brother. The fate of the Great Horde hangs in the balance."
 flavor_steppe.2.a: "Put down this traitorous brother!"
 flavor_steppe.2.a.ctt: "We will attempt to purge the conspirators."
 flavor_steppe.2.b: "Ahmed shall be Khan!"
 flavor_steppe.2.b.ctt: "We will succeed in our attempts to dethrone Mahmud."
 flavor_steppe_2_ctt: "Warning: This action will destabilize the region and may trigger the total collapse of the state."

 flavor_steppe.3.title: "The Rise of Astrakhan"
 flavor_steppe.3.desc: "The coup in Sarai has shattered what remained of the Horde's unity. Fleeing the capital, Mahmud bin Kuchuk has rallied his loyalists in the south, declaring a new Khānate from Xacitarxan. He now awaits our response to his actions."
 flavor_steppe.3.a: "March south! The rebels must hang!"
 flavor_steppe.3.b: "Let them go. We must consolidate our rule."
 flavor_steppe.3.c: "Those pastures look much greener..."
 flavor_steppe_3_c_ctt: "You will switch to playing as the newly independent Astrakhan Khānate."

 flavor_steppe.4.title: "Defiance from Moscow"
 flavor_steppe.4.desc: "Word has arrived from the north: Grand Prince Vasily of Moscow has insolently refused to send our annual tribute. For centuries, the Russian principalities have known their place beneath our heel, but this open defiance threatens our authority. If we allow this insult to stand without a military response, our vassals and rivals alike will see it as a sign of weakness, and the Tatar Yoke could end its rule."
 flavor_steppe.4.a: "Assemble the host! They will learn the cost of treason!"
 flavor_steppe.4.b: "We cannot afford a war right now... let them be."

 flavor_steppe.5.title: "The Grand Prince in Chains"
 flavor_steppe.5.desc: "A triumph beyond our wildest dreams! In the chaos of the campaign, our warriors have captured Grand Prince Vasily himself. The Muscovite host is shattered, and their ruler now sits in our dungeons, completely at our mercy. Moscow's defiance has turned to ash, and the entire realm looks to us to see what price we will extract for the life of their prince."
 flavor_steppe.5.a: "Send word to Moscow. His life carries a steep price."

 flavor_steppe.6.title: "The Fate of the Volga Bulgars"
 flavor_steppe.6.desc: "For over two centuries the remnants of ancient Volga Bulgaria have clung along the trading arteries of the Volga River. After the death of Ghiyas ad-Din at the hands of Küchük Muhammad, and following Ulugh Muhammad's coup in Kazan, they have been reduced to a shadow of their former glory. However, their continued independence remains an obstacle to our absolute dominance over the region."
 flavor_steppe.6.a: "Subjugate them! The Volga belongs to Kazan alone."
 flavor_steppe.6.b: "They pose no threat for now, we will bide our time."

 flavor_steppe.7.title: "The Rebirth of Volga Bulgaria"
 flavor_steppe.7.desc: "An extraordinary resurgence has swept across the steppe. Against all odds, we have recaptured the great city of Kazan, breaking the yoke of our mongolic oppressors. With the ancient heartlands firmly in our grasp, we stand at a monumental crossroads. Volga Bulgaria may yet rise from the ashes."
 flavor_steppe.7.a: "Proclaim the restoration of the State! Let us return to Bolghar in triumph!"
 flavor_steppe.7.b: "We are the masters of the steppe now. Let us build a new Khānate!"

 flavor_steppe.8.title: "Sayid Ahmed's Crimean Ambitions"
 flavor_steppe.8.desc: "In 1441 Sayid Ahmed was driven from the prosperous lands of the Crimean peninsula by the forces of Hacı Giray. Now, with Crimea suffering from divided loyalties, the Crimean Khānate sits ripe for his reconquest. Recapturing the vital trade hubs of the south would secure our dominance over the Black Sea steppes, and position us better to crush Küchük Muhammad in Sarai."
 flavor_steppe.8.a: "We ride! Crimea await us!"
 flavor_steppe.8.b: "We are not yet prepared. Watch the borders and bide our time."

 flavor_steppe.9.title: "The Battle of Perekop"
 flavor_steppe.9.desc: "A stunning and decisive victory has been won at the gates of the peninsula! Sayid Ahmed's invading forces have been utterly shattered on the fortress of Perekop. Their overconfidence proved to be their undoing against our entrenched positions, and the northern host is now fleeing in total disarray."
 flavor_steppe.9.a: "Spread word of our triumph across the steppes!"
 flavor_steppe_9_tt: "This resounding victory will trigger follow-up events, sealing the fate of Sayid Ahmed's horde and shifting regional allegiances."

 flavor_steppe.10.title: "The Disaster at Perekop"
 flavor_steppe.10.desc: "Our grand campaign into the Crimean peninsula has culminated in a catastrophic defeat, at the walls of Perekop. Following our sudden rout, Crimean forces have quickly swept across the frontier, seizing control of strategic locations along the Dnieper and the Azov coast. Our prestige lies in tatters, our legitimacy is bleeding away, and the court is in utter disarray."
 flavor_steppe.10.a: "Sign for peace. We must cut our losses before all is lost."
 flavor_steppe.10.b: "No retreat! Fight on, no matter the cost!"

 flavor_steppe.11.title: "The Debacle at Perekop"
 flavor_steppe.11.desc: "In 1446 Sayid Ahmed's host was caught in its failed siege of Perekop by the forces of Hacı Khan. Now he sweeps across the Black Sea steppe, liberating us from the rule of Sarai. Now that Sayid Ahmed's power has been broken our powerful noble houses have offered our complete allegiance to the victorious Crimean Khānate."
 flavor_steppe.11.a: "We shall swear our oaths to the Girays of Crimea."
 flavor_steppe.11.b: "Maintain our stance. We must watch how the dust settles."
 flavor_steppe.11.c: "We bow to no one! Proclaim our independence!"

 flavor_steppe.12.title: "The Vulnerability of Sayid Ahmed"
 flavor_steppe.12.desc: "The catastrophic failure at Perekop has exposed the profound weakness of Sayid Ahmed's horde. Stripped of his finest warriors and tarnished by defeat, his grip on power is slipping by the day. Such profound vulnerability presents an unforgettable opportunity for our own court. If we act quickly, we can coordinate with the victorious Crimeans to completely partition his remaining domains, ending this troublesome pretender to the Golden Throne once and for all."
 flavor_steppe.12.a: "Dispatch envoys to Crimea. Let us divide the spoils."
 flavor_steppe.12.b: "It is too dangerous to interfere right now."
 flavor_steppe_12_tt: "If Crimea accepts our proposal, Sayid Ahmed's remaining territories will be permanently divided between our two realms."
 flavor_steppe_12_2_tt: "We will abandon our ambitions toward Sayid Ahmed's lands, closing off this opportunity."

 flavor_steppe.13.title: "An Offer from Sarai"
 flavor_steppe.13.desc: "An envoy from the east has arrived at our court, bearing a proposal from the Khan of the Great Horde. They recognize that Sayid Ahmed's catastrophic defeat at Perekop has left his realm completely vulnerable. Rather than allowing the region to fall into prolonged chaos, they have proposed a coordinated strike to permanently partition his remaining domains between our two realms, and prevent Lithuanian encroachment."
 flavor_steppe.13.a: "This is a golden opportunity!"
 flavor_steppe.13.b: "Ignore the messengers."
 flavor_steppe_13_tt: "If the campaign is successful, Sayid Ahmed's lands will be partitioned between us and the Great Horde."
 flavor_steppe.14.title: "The Fall of Sayid Ahmed"
 flavor_steppe.14.desc: "It is finished. With the fall of Shakhty and the decisive defeat of his remaining loyalists, Sayid Ahmed's turbulent reign has come to an end. The broken fragments of his host can no longer offer any resistance, and have fled abroad. In accordance with our treaty, our forces have met with our Crimean counterparts to permanently divide his territories. Order has been restored to the steppes, and our shared victory has brought immense prestige to both our dynasties."
 flavor_steppe.14.a: "Divide the spoils as agreed. His realm is no more."

 shakhty_fallen: "Shakty Captured"
 muscovy_tribute_ended: "Muscovy Ceased Tributes"
 split_horde: "Astrakhan has Declared Independence"