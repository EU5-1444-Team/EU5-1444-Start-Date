l_english:
 flavor_india.1.title: "The Langah Tribe Storms Multan"
 flavor_india.1.desc: "Under the pretense of a peaceful visit, Rai Sahra and his Langah tribesmen have entered the gates of Multan. Before the garrison could react, the warriors seized key posts across the city and surrounded the palace, demanding the immediate resignation of Shaikh Yousaf Qureshi."
 flavor_india.1.entry: "The Langah Tribe Storms Multan"
 flavor_india.1.a: "Its a disaster!"
 flavor_india.1.b: "Rally to Yousaf Qureshi!

 flavor_india.2.title: "The Rise of Ladakh"
 flavor_india.2.entry: "The Rise of Ladakh"
 flavor_india.2.desc: "For years, the kingdom of Maryul has been restless. The lords of Basgo have long chafed under the rule of Leh, and whispers of rebellion have grown louder with each passing season. Now Bhagan, a lord of Basgo, has made his move — rallying the discontented and marching on Leh itself. The capital's own people have thrown open the gates, and our soldiers report that the city offers no resistance. The throne of Maryul trembles."
 flavor_india.2.a: "Rally to the Flag!""
 flavor_india.2.b: "March the guard to Leh. The king will not yield."

 flavor_india.3.title: "A Crown Without a Sultan"
 flavor_india.3.entry: "A Crown Without a Sultan"
 flavor_india.3.desc: "The abdication of Alauddin Alam Shah marks the end of the Sayyid dynasty's grip on the throne of Delhi. With our borders encroached we must decide on a new Sultan to lead us to glory once again."
 flavor_india.3.a: "Bahlul is the best choice to lead the Sultanate"
 flavor_india_3_a_ctt: "Sirhind will annex Delhi. This WILL result in a game over"
 flavor_india.3.b: "Raise a local noble, we will not have an outsider on our throne!"

 flavor_india.4.title: "Bahlul Lodi Departs for Delhi"
 flavor_india.4.desc: "An invitation from the capital has arrived: the nobles of Delhi have formally offered us the crown followiong Alauddin's abdication. Let the iron house of Lodi rule Delhi forever more."
 flavor_india.4.a: "A throne? For me?"

 flavor_india.5.title: "Delhi Refuses to Crown Bahlul"
 flavor_india.5.desc: "The establishment in Delhi has rejected our rightful claim to the capital, choosing defiance over unity. We must take by the sword that inheritance that was denied to us."
 flavor_india.5.a: "They will pay for their stubborness"