l_english:
 muscovite_domination: "Muscovite Domination"

 flavor_muscovy.100.title: "The Submission of Perm"
 flavor_muscovy.100.entry: "The Submission of Perm"
 flavor_muscovy.100.desc: "For decades, the wealthy lands of the Kama River and the Ural foothills have enjoyed relative autonomy under our loose over-lordship. However as the Grand Duchy consolidates its power, we can no longer tolerate semi-independent entities on our eastern frontier. The time has come to demand absolute submission from the rulers of Perm, securing the gateways to Siberia."
 flavor_muscovy.100.a: "Send the Ultimatum."
 flavor_muscovy.100.ctt: "An ultimatum demanding absolute vassalage and the installation of a loyal ruler will be dispatched to the rulers of Perm."

 flavor_uralic.1.title: "Unification of Pelym"
 flavor_uralic.1.entry: "Unification of Pelym"
 flavor_uralic.1.desc: "The Principality of Pelym has long cast a shadow over the neighboring Mansi lands of Kondia. To withstand the encroaching threats from both the southern steppes and the growing power of Moscow to the west, our elders argue that the Uralic tribes must stand as one."
 flavor_uralic.1.a: "Propose union to Kondia."
 flavor_uralic.1.ctt: "Kondia will be unfied with our realm"

 flavor_uralic.2.title: "Unification"
 flavor_uralic.2.entry: "Unification"
 flavor_uralic.2.desc: "An envoy from Pelym has arrived at our court. They argue that the fragmenting tribes of the Urals cannot survive the coming centuries alone. They demand that we acknowledge the Prince of Pelym as our rightful sovereign."
 flavor_uralic.2.a: "We accept their protection and swear fealty."
 flavor_uralic.2.b: "We accept. But we shall lead."

 flavor_uralic.3.title: "The Shadow of Moskva"
 flavor_uralic.3.entry: "The Shadow of Moskva"
 flavor_uralic.3.desc: "In 1451, with the conflicts between Vasily and his brother resolved, Moscow dispatched the family of Yermolay Rukird to conquer the lands of Perm, bringing them under Muscovite control, and paving the way for the first Muscovite-led crossings of the Urals"
 flavor_uralic.3.a: "We have no choice but to submit to the Grand Duke."
 flavor_uralic.3.b: "We will never bow to Moscow! To arms!"

 flavor_muscovy.101.title: "The Tatar Yoke Question"
 flavor_muscovy.101.desc: "For generations, the Grand Principality of Moscow has bowed to the East, sending massive sums of silver and wealth to satisfy the Khans of the Golden Horde. But as internal strife tears our suzerains apart, the time has come to ask whether we should continue to bleed our treasury dry for a master that can no longer project its shadow over Russia."
 flavor_muscovy.101.a: "Not one more coin to the Horde!"
 flavor_muscovy.101.b: "We are not yet strong enough to defy them. Send the tribute."
 flavor_muscovy.102.title: "The Ransom of Vasily"
 flavor_muscovy.102.desc: "Disaster has struck the realm. Grand Prince Vasily has been taken captive on the battlefield, leaving Moscow leaderless and humiliated. The Khans have made their demands clear: a staggering ransom of eight hundred gold pieces must be paid immediately from our depleted treasury to secure his release. To refuse is to abandon our ruler to the dungeons, but paying this exorbitant sum will empty our coffers, shatter our prestige, and plunge the state into deep instability."
 flavor_muscovy.102.a: "Pay the gold. Empty the treasury to bring our Prince home."
 flavor_muscovy.103.title: "Shattering the Tatar Yoke"
 flavor_muscovy.103.desc: "Against all odds, the Grand Principality of Moscow has stood firm. Having defied the Khans and withstood their wrath, our borders are secure, our armies are victorious, and peace has returned to the realm. The age-old submission of the Russian lands is no more; the Tatar Yoke has been completely broken, and a new era of sovereign majesty begins for Moscow."
 flavor_muscovy.103.a: "We bow to no foreign master!"