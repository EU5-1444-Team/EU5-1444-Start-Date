l_english:
 muscovite_domination: "Muscovite Domination"

 flavor_muscovy.100.title: "The Submission of Perm"
 flavor_muscovy.100.entry: "The Submission of Perm"
 flavor_muscovy.100.desc: "For decades, the wealthy lands of the Kama River and the Ural foothills have enjoyed relative autonomy under our loose over-lordship. However as the Grand Duchy consolidates its power, we can no longer tolerate semi-independent entities on our eastern frontier. The time has come to demand absolute submission from the rulers of Perm, integrating them fully into our web of vassals and securing the gateways to Siberia."
 flavor_muscovy.100.a: "Send the Ultimatum."
 flavor_muscovy.100.a: "An ultimatum demanding absolute vassalage and the installation of a loyal ruler will be dispatched to the rulers of Perm."

 flavor_uralic.1.title: "Unification of Pelym"
 flavor_uralic.1.entry: "Unification of Pelym"
 flavor_uralic.1.desc: "The Principality of Pelym has long cast a shadow over the neighboring Mansi lands of Kondia. To withstand the encroaching threats from both the southern steppes and the growing power of Moscow to the west, our elders argue that the Uralic tribes must stand as one."
 flavor_uralic.1.a: "Propose union to Kondia."
 flavor_uralic.1.ctt: "Kondia will be unfied with our realm"

 flavor_uralic.2.title: "Unification"
 flavor_uralic.2.entry: "Unification"
 flavor_uralic.2.desc: "An envoy from Pelym has arrived at our court,. They argue that the fragmenting tribes of the Urals cannot survive the coming centuries alone. They demand that we acknowledge the Prince of Pelym as our rightful sovereign."
 flavor_uralic.2.a: "We accept their protection and swear fealty."
 flavor_uralic.2.b: "We accept. But we shall lead."

 flavor_uralic.3.title: "The Shadow of Moskva"
 flavor_uralic.3.entry: "The Shadow of Moskva"
 flavor_uralic.3.desc: "A solemn herald from the Grand Duke of Moscow has arrived, carrying a decree that leaves no room for negotiation. Moscow demands that we renounce our complete independence, accept a centralized monarchy ruled by a prince of Muscovite approval, and bow as a formal vassal to the Grand Duke. Defiance will mean war"
 flavor_uralic.3.a: "We have no choice but to submit to the Grand Duke."
 flavor_uralic.3.b: "We will never bow to Moscow! To arms!"

 flavor_bsh.50.title: "A Nation Reborn"
 flavor_bsh.50.desc: "The tribes have united under a single banner — the scattered clans of the Ural mountains and the Belaya river valleys now ride as one people. But what kind of nation shall we be? The old ways of the confederation served us well, binding the tribes together through custom and consent. Yet there are those who argue that the age of khans has come — that only a strong ruler on a golden throne can hold what we have won and reach for more"
 flavor_bsh.50.a: "We are Bashkir. Our strength is in our tribes, our customs. Let the confederation endure"
 flavor_bsh.50.b: "The age of khans is upon us. Let Bashkiria dominate the steppe."