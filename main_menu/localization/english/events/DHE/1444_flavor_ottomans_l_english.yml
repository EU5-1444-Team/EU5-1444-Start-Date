l_english:
 flavor_tur_1444.1.title: "The Title of the Ottoman Ruler"

 flavor_tur_1444.1.desc: "The Ottoman sultans have long held many titles, each reflecting a different aspect of their power and the lands they rule. As the new sovereign of the Ottoman Empire, you must decide how history shall remember you. Will you proclaim yourself Padishah, supreme ruler above all kings? Or take the mantle of Beylerbey, master of governors and lord of lords? Perhaps you claim the sacred title of Caliph, protector of the faithful across the Muslim world. Or will you declare yourself Kayser-i Rum, heir to the legacy of Rome and its emperors? Each choice shapes how your subjects, and the world, will perceive your reign."

 flavor_tur_1444.1.a: "Padishah, Sovereign above all kings!"
 flavor_tur_1444.1.b: "Beylerbey, Lord of lords, master of governors!"
 flavor_tur_1444.1.c: "Caliph, Leader and protector of the faithful!"
 flavor_tur_1444.1.d: "Kayser-i Rum, Heir to the Roman emperors!"

 flavor_tur_1444.2.title: "The conquest of Constantinople"
 flavor_tur_1444.2.desc: "With the inevitable fall of the Theodosian walls, Konstantiniyye is finally ours. Now that the remnants of Rome have been extinguished, it is up to us to take on the mantle of the Roman legacy. The title of Kayser-i Rum, or Caesar of Rome, is a powerful symbol of our claim to be the rightful heirs of the Roman Empire. By adopting this title, we assert our dominance over the former Byzantine territories and signal to the world that we are the new center of power in the region. It is a bold declaration that will shape how our reign is remembered for generations to come!"
 flavor_tur_1444.2.a: "Adopt the title of Kayser-i Rum, asserting our claim to the Roman legacy!"
 flavor_tur_1444.2.b: "We are sons of Osman, not Romans!"