l_english:
 flavor_ira.250.title: "A Question of Name"
 flavor_ira.250.desc: "For centuries, the world has looked upon this land through the lens of antiquity, calling us by names born of Western tongues and ancient echoes. But as the foundations of the modern state take shape, a fundamental question emerges within the halls of power: Should we embrace the title the world has forced upon us, or reclaim the name that has lived in the hearts of our people since time immemorial?"
 flavor_ira.250.a: "The name Persia carries the weight of empires. We shall keep it"
 flavor_ira.250.b: "We define ourselves. From this day forward, we are Iran."