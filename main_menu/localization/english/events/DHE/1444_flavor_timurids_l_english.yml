l_english:
 flavor_tif.1.title: "The Changing Hues of Shīrāz"
 flavor_tif.1.desc: "Tradition dictates that a nation's colors are forged in blood and history, but [ROOT.GetCountry.GetGovernment.GetRulerTitle] [target_ruler_fars.GetName] finds such notions dreadfully dull. Arguing that a monochromatic state stifles the creative spirit of the people, the throne has ordered a total reimagining of our heraldry. The royal dye-works are in a state of chaos as weavers struggle to keep pace with the court’s rapidly evolving palette. Today, Shīrāz wears a new face."
 flavor_tif.1.a: "Curse you, John Paradox!"
 flavor_tif.2.a: "Wait, I liked the previous one better!"
 flavor_tif.2.b: "Not again...."