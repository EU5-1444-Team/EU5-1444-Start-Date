l_english:
  1444_shan_confederation.1.title: "The Court Empties"
  1444_shan_confederation.1.desc: "The Shan incursion has broken the king’s peace. Monasteries pack their relics, officials conceal their seals, and households abandon their compounds. A stream of the displaced slips away from Ava, seeking protection under another lord."
  1444_shan_confederation.1.a: "They go in search of safety."

  1444_shan_confederation.2.title: "DEBUG: You Should Not See This"
  1444_shan_confederation.2.desc: "If this event is visible, something has gone very wrong. The hidden refugee transfer failed to stay hidden."
  1444_shan_confederation.2.a: "Report this immediately."

  1444_shan_confederation.3.title: "Newcomers at Taungoo"
  1444_shan_confederation.3.desc: "Refugees from Ava arrive in growing numbers. Some bring only exhaustion, others bring skills — men who can keep accounts, train soldiers, copy texts, and rebuild workshops. If welcomed, their knowledge may strengthen our realm."
  1444_shan_confederation.3.a: "Give them land and service."

  1444_shan_confederation.4.title: "Shelter at Prome"
  1444_shan_confederation.4.desc: "Crowds gather outside the gates and along the riverbanks. The displaced speak of burned halls and abandoned shrines, yet they also bring labor and learning. How we receive them will shape what follows."
  1444_shan_confederation.4.a: "Let them enter under our protection."