l_english:
 flavor_frisia.1.t: "The Emperor's Offer"
 flavor_frisia.1.d: "Word has reached us from the Imperial court. The Emperor, seeking to extend his influence along the North Sea coast, has offered East Frisia recognition as a Prince of the Holy Roman Empire. Acceptance would bring the prestige and protection of the Empire — but it would mean bringing Emden under our suzerainty, abandoning our republican traditions, and leaving the Frisian Freedom behind."
 flavor_frisia.1.a: "Accept. East Frisia shall kneel to the Emperor."
 flavor_frisia.1.b: "Refuse. We remain free Frisians."
 flavor_frisia.2.t: "The Frisian Uprising"
 flavor_frisia.2.d: "The Frisian folk of West Frisia have long chafed under our rule. Word reaches us that their leaders have taken up the old cry — Eala Frya Fresena — and the marshlands are stirring. The Frisian Freedom watches from across the water. How shall we answer?"
 flavor_frisia.2.a: "Keep them as a loyal vassal."
 flavor_frisia.2.b: "Let them go and welcome the new state into the Frisian Freedom."
 flavor_frisia.2.c: "Let the Frisian Freedom lead their war of independence."
 flavor_frisia.2.c: "Let them raise the banner of freedom."
 flavor_frisia.3.t: "The North Frisians Stir"
 flavor_frisia.3.d: "The Frisian villages along our northern coast have grown restless. Emboldened by the Frisian Freedom to the south, their elders speak openly of liberation. A spark here could light a fire we cannot easily put out."
 flavor_frisia.3.a: "Remind them who holds these lands."
 flavor_frisia.3.b: "Let them leave and have diplomatic freedom within the Frisian Freedom."
 flavor_frisia.3.c: "Let the Frisian Freedom fight their independence war."
