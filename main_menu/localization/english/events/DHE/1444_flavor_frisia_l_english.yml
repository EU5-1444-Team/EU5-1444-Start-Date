l_english:
 efr_events.1.t: "The Emperor's Offer"
 efr_events.1.d: "Word has reached us from the Imperial court. The Emperor, seeking to extend his influence along the North Sea coast, has offered East Frisia recognition as a Prince of the Holy Roman Empire. Acceptance would bring the prestige and protection of the Empire, but it would mean absorbing $EMD$ into our realm, abandoning our republican traditions, and leaving the Frisian Freedom behind."
 efr_events.1.a: "Accept. East Frisia shall kneel to the Emperor."
 efr_events.1.a_tt: "East Frisia annexes $EMD$, becomes a monarchy, and joins the Holy Roman Empire, leaving the Frisian Freedom."
 efr_events.1.b: "Refuse. We remain free Frisians."
 efr_events.1.b_tt: "East Frisia remains a republic and stays in the Frisian Freedom."