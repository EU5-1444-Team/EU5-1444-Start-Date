l_english:
 io_unification.1.title: "Annexation into the New Realm"
 io_unification.1.desc: "The unification is upon us. Our sovereignty is at an end, but our people shall find new purpose under a greater banner. The old order makes way for the new, and we must accept our place in the reborn state"
 io_unification.1.a: "Annex"
 io_unification.10.title: "The Khalkha Heartland United"
 io_unification.10.desc: "The khans of the eastern steppe have answered our call. From the banks of the Onon to the pastures of the Kherlen, the Khalkha clans stand as one. Our confederation is no longer a loose alliance of wary tribes—it is the foundation of a nation that will shape the fate of the steppe for generations to come"
 io_unification.10.a: "Unify Khalkha"
 io_unification.10.ctt: "Every Khalkha clan is formally absorbed into the new realm"
 io_unification.20.title: "The Unification of the Khorchin"
 io_unification.20.desc: "The Khorchin tribes, masters of the eastern frontier, have pledged their banners to our cause. What was once a gathering of separate yurts now becomes a single khanate, bound by shared blood and a common purpose. The horses are saddled, and the path forward is clear"
 io_unification.20.a: "Unify Khorchin"
 io_unification.20.ctt: "Every Khorchin clan is formally absorbed into the new realm"
 io_unification.30.title: "A Single Nogai Yurt"
 io_unification.30.desc: "The Nogai Horde has long been a byword for division, its princes feuding while the wolves grew fat. No longer. The tribes of the Caspian steppe are woven into one, their spears pointed outward. The Great Nogai Yurt rises from the ashes of petty rivalry"
 io_unification.30.a: "Unify Nogai"
 io_unification.30.ctt: "Every Nogai clan is formally absorbed into the new realm"
 io_unification.40.title: "The Bashkir Confederation United"
 io_unification.40.desc: "From the foothills of the Urals to the banks of the Volga, the Bashkir tribes have set aside their differences. The council fires that once burned for each clan alone now burn for all. A new realm takes shape upon the frontier, hardy and proud"
 io_unification.40.a: "Unify Bashkir Tribes"
 io_unification.40.ctt: "Every Bashkir clan is formally absorbed into the new realm"
 io_unification.50.title: "The Bashkir Horde Rides United"
 io_unification.50.desc: "The Bashkir lands are no longer a patchwork of tribal pastures and petty fortresses. We have forged them into a horde, a single mailed fist aimed at the horizon. The steppe trembles under the hooves of our united riders"
 io_unification.50.a: "Unify Bashkir Horde"
 io_unification.50.ctt: "Every Bashkir clan is formally absorbed into the new horde"
 io_unification.60.title: "Albania Rises"
 io_unification.60.desc: "The League of Lezhe was born from the necessity of resistance. Now it matures into something greater—a kingdom worthy of Skanderbeg's vision. The Albanian nobles have surrendered their crowns to the double-headed eagle, and the mountains echo with the cry of a nation reborn"
 io_unification.60.a: "Unify Albania"
 io_unification.60.ctt: "Every Albanian clan is formally absorbed into the new kingdom"
 io_unification.70.title: "A Single Circassian Throne"
 io_unification.70.desc: "The princes of Circassia have long looked upon each other with suspicion, each valley a separate realm. Today we change that. The Adyghe lands unite under one banner, and the Caucasus stands ready to face all comers—whether from the north or the south"
 io_unification.70.a: "Unify Circassia"
 io_unification.70.ctt: "Every Circassian clan is formally absorbed into the new realm"
 io_unification.80.title: "The Oirats Forge Their Destiny"
 io_unification.80.desc: "The Four Oirat tribes have chosen a single path. The western steppe, from the Altai to the Caspian, becomes a crucible of power. Under our reform, the confederation sheds its old ways and emerges as a state that will challenge the very order of Asia"
 io_unification.80.a: "Unify Oirat"
 io_unification.80.ctt: "Every Oirat clan is formally absorbed into the new realm"
 io_unification.90.title: "The Jurchen Unification"
 io_unification.90.desc: "The forests of Manchuria have never known a single master, but that age is ending. The Jurchen tribes—from the shores of the Liaodong Gulf to the Amur's frozen banks—are bound together by iron and oath. A new power stirs in the east"
 io_unification.90.a: "Unify Jurchen"
 io_unification.90.ctt: "Every Jurchen tribe is formally absorbed into the new realm"
 io_unification.100.title: "A Free and United Frisia"
 io_unification.100.desc: "The Frisian lands have known no king, only the collective will of free communities. Now that will has coalesced into a single purpose. From the Zuiderzee to the Ems, the seven sea-lands become one—not by conquest, but by the ancient right of the Frisian people to stand together as a sovereign realm"
 io_unification.100.a: "Unify Frisia"
 io_unification.100.ctt: "Every Frisian member is formally absorbed into the new realm"
 io_unification.40.title: "The Bashkir Tribes Unite"
 io_unification.40.desc: "The tribes of the Bashkir have long lived under the shadow of the Tatar overlord, paying tribute and lending their warriors to foreign campaigns. But the bonds between our clans run deeper than any overlord's demand. A gathering of all the tribes has been called: The time has come to cast off the yoke of the steppe "
 io_unification.40.a: "Let the Bashkir ride as one!"
 io_unification.40.ctt: "The other tribes of the confederation are absorbed into the new Bashkir state."
 io_unification.50.title: "The Mari Tribes Unite"
 io_unification.50.desc: "For generations the Mari have dwelt in the forests of the Volga and Vetluga, paying tribute to whoever holds power on the steppe. But the time of division is over. The clans gather beneath the sacred oak, and the Mari shall stand as one people"
 io_unification.50.a: "The Mari stand together!"
 io_unification.50.ctt: "The other tribes of the confederation are absorbed into the new Mari state."
 io_unification.140.title: "The Udmurt Tribes Unite"
 io_unification.140.desc: "Between the Kama and the Vyatka the Udmurt have endured, scattered across the forest in their clan settlements, paying tribute northward to those who surround us. Now the Toro has called the clans to council: The Udmurt shall be divided no longer"
 io_unification.140.a: "The Udmurt rise as one!"
 io_unification.140.ctt: "The other tribes of the confederation are absorbed into the new Udmurt state."
 io_unification.130.title: "The Dissolution of the Confederations"
 io_unification.130.desc: "The tribal confederation has long been a useful instrument — tribute flowing into our coffers, warriors riding to our wars. But instruments can be refined. The time has come to end the pretense of confederation and bring these lands under direct administration. The tribal leaders will be absorbed into our nobility or swept aside"
 io_unification.130.a: "Absorb the tribes."
 io_unification.130.ctt: "The tribes of the confederation are absorbed into our realm."