l_english:
 # Initialisation
 red_turban_rebellions.1.title: "The [ShowSituationNameWithNoTooltip('red_turban_rebellions')]"
 red_turban_rebellions.1.desc: "Discontent festers within the realm of [target_country.GetName]. Local elites, disgruntled officials, and opportunistic warlords rise in defiance of the [target_country.GetGovernment.GetRulerTitle].\n\nMisrule, heavy taxation, and failing authority have eroded faith in the [target_country.Custom('GetRulerOrRegentTitle')]. Across the land, factions rally under new banners, seeking to carve their own destiny from the weakening state.\n\nThe [ShowSituationName('red_turban_rebellions')] has begun..."
 red_turban_rebellions.1.a: "Rebellion is the price of weakness."
 red_turban_rebellions.1.a.tt: "The [ShowSituationName('red_turban_rebellions')] starts. For the next #Y 20 years#!, [target_country.GetName] will face #R Warlords#! breaking free from the state. To resolve the situation, every warlord needs to be either reconquered or bribed to be a #Y Loyalist#! to [target_country.GetNameWithNoTooltip]. Additionally, #Y 90#! [legitimacy|e], #Y 30#! [stability|e] and #Y 50#! Celestial Authority are required to end the [situation|e]"
 red_turban_rebellions.1.a.at: "Every [subject|e] country gains [ShowNamedValue('liberty_desire_severe_plus')|-=2] [liberty_desire|e]"
 red_turban_rebellions.2.a: "The Mandate trembles..."
 red_turban_rebellions.release_tag.title: "A New Revolt"
 red_turban_rebellions.release_loyalist.title: "[target_country.GetNameWithNoTooltip] Remains Loyal"
 red_turban_rebellions.release_culture.title: "[target_culture.GetNameWithNoTooltip] Rebels Rise"

 # Revolter tags
 red_turban_rebellions.revolter.title: "The Declaration of [target_country.GetNameWithNoTooltip]"

 red_turban_rebellions.3.desc: "In the lands of [target_location.GetName], discontented officials and peasants alike have rallied together, proclaiming the restoration of the ancient state of Qí. Yet as banners rise, so too do old rivalries, for Qí has ever been a land divided. Now they challenge the rule of [ROOT.GetCountry.GetName], claiming Heaven has abandoned the current order."

 red_turban_rebellions.4.desc: "Amid growing unrest, [target_character.GetName] has gathered a following in [target_location.GetName], declaring the rise of Shùn. Cloaked in virtue and righteous rule, this movement draws strength from the failures of the court, seeking to replace [ROOT.GetCountry.GetName] with a more just order."

 red_turban_rebellions.5.desc: "The mountainous regions of [target_location.GetName] have long bred defiance. Now, the disaffected have united under the banner of Shǔ, retreating into the natural strongholds that once sheltered kingdoms from the grasp of empires."

 red_turban_rebellions.6.desc: "In [target_location.GetName], the rebirth of Wèi has been proclaimed. As in ages past, ambition and intrigue guide its rise, with soldiers and opportunists seeking advantage in the chaos to carve their destiny from our lands."

 red_turban_rebellions.7.desc: "The rich lands of [target_location.GetName] now stir with rebellion, as the state of Wú is declared. Prosperity fuels their cause, yet with wealth comes ambition—and the risk of reaching too far, too fast."

 red_turban_rebellions.8.desc: "From the heartlands of [target_location.GetName], the restoration of Qín is proclaimed. With rigid authority and bold claims of legitimacy, they seek to impose order upon chaos, as though the lessons of their swift rise and fall have been forgotten."

 red_turban_rebellions.9.desc: "The lands of [target_location.GetName] have risen, declaring the return of Chǔ. Fierce and proud, they draw strength from local traditions, yet such passion has undone them before, even as they now stand in defiance of imperial authority."

 red_turban_rebellions.10.desc: "Invoking the legacy of past greatness, Táng has been proclaimed in [target_location.GetName]. Many flock to this banner, dreaming of a golden age restored, though such brilliance has long since faded into memory."

 red_turban_rebellions.11.desc: "In the northern reaches of [target_location.GetName], the banner of Yān has been raised. Supported by local elites, this distant realm once more stands apart, its isolation both shield and weakness as rebellion spreads."

 red_turban_rebellions.12.desc: "The state of Jìn has been declared in [target_location.GetName], even as factions within the realm fracture further. As before, unity proves fleeting, and division threatens to define its fate once more."

 red_turban_rebellions.13.desc: "Along the southeastern coast, the independence of Mǐn is proclaimed. Prosperous and vibrant, yet often fleeting in power, this coastal realm rises again against [ROOT.GetCountry.GetName]."

 red_turban_rebellions.14.desc: "The prosperous lands of [target_location.GetName] now stand under the banner of Yuè. Trade and wealth sustain their defiance, yet such riches have as often invited downfall as they have secured power."

 red_turban_rebellions.15.desc: "In [target_location.GetName], Liáng has been declared, rallying those disillusioned with imperial rule. Yet as in ages past, it rises in the shadow of greater powers, its fate uncertain."

 red_turban_rebellions.16.desc: "The declaration of Níng in [target_location.GetName] marks yet another fracture in the realm. Though its name speaks of peace, it is born into turmoil, where such hopes are seldom realized."

 red_turban_rebellions.17.desc: "In the western lands of [target_location.GetName], Xī is proclaimed, seeking to establish a new order far from the imperial center. Distance grants them freedom—but also leaves them beyond the heart of power."

 red_turban_rebellions.18.desc: "The banner of Yí has been raised in [target_location.GetName], drawing followers from those long beyond the reach of the court. Once seen as outsiders, they now assert their own place against imperial rule."

 red_turban_rebellions.19.desc: "In [target_location.GetName], the state of Huái has been declared, rallying support among those who see weakness in [ROOT.GetCountry.GetName]. Yet this land, long contested and divided, has rarely known lasting unity."

 red_turban_rebellions.20.desc: "Among the highlands and frontiers, the Míáo peoples have rallied together, declaring independence from [ROOT.GetCountry.GetName]. Their resistance is not new, but part of a long struggle between the uplands and the empire below."

 red_turban_rebellions.21.desc: "As the [ROOT.GetCountry.GetName] weakens, loyalists of the fallen Ming have fled beyond the mainland. In Tûng-nèn they establish a refuge, clinging to the hope that exile is but a prelude to restoration."

 red_turban_rebellions.22.desc: "In Liáodōng, local chieftains and frontier elites cast off imperial authority. From Liaoyang they proclaim a restored Liáo, seeking to revive a legacy long tied to the steppe and its shifting powers."

 red_turban_rebellions.23.desc: "In the western reaches of [target_location.GetName], the Huí peoples have risen in revolt, drawing strength from faith and shared identity. Bound not only by land but by belief, they now challenge the Mandate of Heaven held by the crumbling empire."

 red_turban_rebellions.24.desc: "The western desert towns have coalesced around new leadership among the Yúghur people. From their ancient cities along the trade routes, they reject the faltering authority of [ROOT.GetCountry.GetName], heirs to a past shaped by commerce, survival, and the shifting sands."

 red_turban_rebellions.25.desc: "In the heartlands of [target_location.GetName], the restoration of Hàn is proclaimed. Invoking the memory of a dynasty born from humble beginnings, they rally the people of the central plains against the failing authority of [ROOT.GetCountry.GetName]."

 red_turban_rebellions.26.desc: "From the mountains and plains of [target_location.GetName], the banner of Zhào is raised. Drawing on the legacy of hardened soldiers and frontier valor, they rise once more to challenge the rule of [ROOT.GetCountry.GetName] from the north."

 # Warring States Qi known for internal division
 red_turban_rebellions.3.a: "Qí will fracture as it always has."

 # Emperor Shun = virtuous sage ruler
 red_turban_rebellions.4.a: "Shùn's virtue will not save her from fate."

 # Shu = isolation in Sichuan basin
 red_turban_rebellions.5.a: "Shǔ will retreat to its mountains—and be forgotten."

 # Wei = often politically outplayed (Three Kingdoms / Warring States)
 red_turban_rebellions.6.a: "Wèi will be outmaneuvered, as before."

 # Wu = bold but overextended (Sun Quan era, earlier Wu-Yue)
 red_turban_rebellions.7.a: "Wú overreaches, as it always has."

 # Qin = harsh Legalism → rapid collapse
 red_turban_rebellions.8.a: "Qín's tyranny will invite its own downfall."

 # Xiang Yu, overconfidence vs Liu Bang
 red_turban_rebellions.9.a: "Chǔ's pride will be its ruin once more."

 # Golden age nostalgia, cannot be restored
 red_turban_rebellions.10.a: "Táng's glory belongs to the past."

 # Yan = northern, often isolated buffer state
 red_turban_rebellions.11.a: "Yān will stand alone—and fall alone."

 # Jin split into Han/Zhao/Wei
 red_turban_rebellions.12.a: "Jìn will fracture, as it did before."

 # Min kingdoms = short-lived southern states
 red_turban_rebellions.13.a: "Mǐn will prosper briefly, then fade."

 # Yue = rich southern trade states, often unstable
 red_turban_rebellions.14.a: "Yuè's wealth will breed its downfall."

 # Liang = frequently overshadowed dynasties/states
 red_turban_rebellions.15.a: "Liáng will be swept aside by stronger powers."

 # Ning = frontier instability, name implies “peace”
 red_turban_rebellions.16.a: "Níng will find no peace in rebellion."

 # Xi = western/peripheral implication
 red_turban_rebellions.17.a: "Xī will remain distant—and powerless."

 # Yi = “barbarian” designation historically
 red_turban_rebellions.18.a: "Yí will remain beyond the realm, as always."

 # Huai region = contested, unstable
 red_turban_rebellions.19.a: "Huái will drift, lacking the strength to endure."

 # Miao = recurring upland resistance
 red_turban_rebellions.20.a: "The highlands have risen before—and been subdued."

 # Ming loyalists in exile
 red_turban_rebellions.21.a: "Exiles may dream, but they do not reclaim empires."

 # Liao (Khitan) long gone, cannot truly return
 red_turban_rebellions.22.a: "Liáo will not restore what time has buried."

 # Hui = religious identity vs imperial order
 red_turban_rebellions.23.a: "Faith alone has never ruled the Middle Kingdom."

 # Yughur / Sarig Yogir = Silk Road remnants
 red_turban_rebellions.24.a: "The desert remembers—but it does not preserve empires."

 # Liu Bang’s rise from peasantry
 red_turban_rebellions.25.a: "Hàn rose from humble origins. This one will not."

 # Zhao = famed for cavalry/martial strength, yet fell
 red_turban_rebellions.26.a: "Zhào's valor will not save it this time."

 red_turban_rebellions.27.desc: "On the tropical isle of [target_location.GetName], the Hlai people rise against the distant authority of [ROOT.GetCountry.GetName]. Long kept to the margins of the realm, they now reclaim their shores, drawing strength from the sea, the soil, and a heritage older than the Mandate itself."
 red_turban_rebellions.27.a: "The isles yield no empire."

  # Generic Culture Release
 red_turban_rebellions.100.desc: "As the authority of [ROOT.GetCountry.GetName] falters, ambitious leaders among the [target_culture.GetName] people seize their moment. Rallying local support, they proclaim their own rule and cast off imperial control.\n\nWhat was once a unified realm now fractures further, as yet another warlord rises from within."

 red_turban_rebellions.100.desc.fallback: "As imperial authority weakens, opportunists rise to carve their own domains from the crumbling state. Another warlord emerges, challenging the unity of the realm."

 red_turban_rebellions.100.a: "Placate them—for now."
 red_turban_rebellions.100.b: "Crush them without mercy."

 # Player info event
 red_turban_rebellions.101.title: "A Warlord Rises"
 red_turban_rebellions.101.desc: "A new power has emerged within the realm, carving out territory and asserting independence. Whether through ambition or desperation, yet another warlord now shapes the fate of the fractured empire."
 red_turban_rebellions.101.a: "So be it."
 red_turban_rebellions.101.a.tt: "A new warlord state has been established."
 red_turban_rebellions.play_as_tag: "I wonder what might the future hold for [target_country.GetNameWithNoTooltip]..."

 ###########################
 # Generic disaster events #
 ###########################

 # Peasant Revolt
 red_turban_rebellions.200.title: "Peasant Unrest"
 red_turban_rebellions.200.desc: "The common folk grow restless under the burdens placed upon them. Taxes, hardship, and neglect have driven them to open defiance, and their anger now manifests in organized resistance.\n\nIf left unchecked, this unrest may grow into something far more dangerous."

 red_turban_rebellions.200.a: "Suppress them."
 red_turban_rebellions.200.b: "Appease their grievances."

 # Mandate Questioned
 red_turban_rebellions.201.title: "The Mandate Questioned"
 red_turban_rebellions.201.desc: "As rebellion spreads, the nobility begin to question the legitimacy of our rule. Some whisper that Heaven has withdrawn its favor, while others prepare to act upon such beliefs.\n\nIf their doubts are not addressed, they may soon join those who already defy us."

 red_turban_rebellions.201.a: "Reassert our authority."
 red_turban_rebellions.201.b: "Make concessions to secure loyalty."

 # Support of the Ruler
 red_turban_rebellions.202.title: "Support of [target_character.GetName]"
 red_turban_rebellions.202.desc: "Despite the turmoil, [target_character.GetName] has managed to rally support among the people. Through strength, charisma, or necessity, the ruler’s position is reinforced, and order is restored—if only for a moment."

 red_turban_rebellions.202.a: "The people stand with us."
 red_turban_rebellions.202.a.tt: "Public support strengthens control across the realm."
 red_turban_rebellions.202.char.tt: "Talented individuals emerge to serve the state."

 ########################
 # Situation end events #
 ########################

 # Rise of a New Dynasty
 red_turban_rebellions.1000.title: "The Rise of a New Dynasty"
 red_turban_rebellions.1000.desc: "The old order has crumbled. From the chaos of rebellion and war, a new power has emerged victorious, claiming the Mandate of Heaven.\n\nThe banners of the past are cast down, and a new dynasty rises to rule over the realm."

 red_turban_rebellions.1000.a: "Heaven has chosen its new ruler."

 red_turban_rebellions.1001.a: "The old order is swept away."

 red_turban_rebellions.1002.a: "A new dynasty ascends."

 # China Persists
 red_turban_rebellions.1003.title: "The Mandate Endures"
 red_turban_rebellions.1003.desc: "Despite the turmoil, the state has weathered the storm. Rebels have been defeated or brought to heel, and the unity of the realm is restored.\n\nThough shaken, the Mandate of Heaven remains intact."

 red_turban_rebellions.1003.a: "Order is restored."

 red_turban_rebellions.1004.desc: "With the rebellion ended, the remaining dissidents are absorbed back into the state. Unity is reestablished, and the authority of the realm stands unchallenged once more."

 red_turban_rebellions.1004.a: "They are reintegrated."

 # End of Mandate fallback
 red_turban_rebellions.1005.title: "The Mandate Lost"
 red_turban_rebellions.1005.desc: "The structures that upheld the realm have collapsed entirely. With no clear successor and no unity remaining, the Mandate of Heaven has been lost.\n\nFrom this chaos, a new order must eventually emerge."

 red_turban_rebellions.1005.a: "The Mandate has fallen."

 # Rebel Stagnation
 red_turban_rebellions.1006.title: "Endless Turmoil"
 red_turban_rebellions.1006.desc: "The realm remains trapped in a cycle of rebellion and suppression. No faction has managed to claim decisive victory, and the land suffers under constant strife.\n\nWithout resolution, the chaos threatens to become the new normal."

 red_turban_rebellions.1006.a: "This cannot continue forever..."

#Red Turban Rebellions
mandate_crisis: "Crisis of the Mandate"
mandate_crisis_desc: "The authority of the realm falters as rebellion spreads across the land. Warlords, rebels, and opportunists rise to challenge the existing order, each claiming legitimacy in a time of chaos.\n\nAs the crisis deepens, the very mandate to rule is called into question."

red_turban_rebellions: "Crisis of the Mandate"
red_turban_rebellions_desc: "The authority of the realm falters as rebellion spreads across the land. Warlords, rebels, and opportunists rise to challenge the existing order, each claiming legitimacy in a time of chaos.\n\nAs the crisis deepens, the very mandate to rule is called into question."

