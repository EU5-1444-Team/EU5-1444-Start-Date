# Situation Actions
rtr_grant_titles: "Grant Honors and Privileges"
rtr_grant_titles_desc: "#flavor Titles and favor remain powerful tools of statecraft. By rewarding ambitious leaders, we may draw them back into loyalty—or at least temper their defiance.#!\n\n[actor.GetName] spends #R 5#! Legitimacy and transfers part of their [income|e] to increase the target's $rtr_yuan_allegiance$ by #G +15#!"

rtr_grant_titles_select_country: "Select Warlord State"

rtr_negotiate_with_rebels: "Negotiate with Dissidents"
rtr_negotiate_with_rebels_desc: "#flavor Not all who rise seek dominion. Many are driven by hardship and neglect. Through careful negotiation, their unrest may yet be quieted.#!\n\n[actor.GetName] reduces the progress of a [rebel|e] faction by #G -30.00%#!"
rtr_negotiate_with_rebels_select_rebels: "Select Rebel Faction"
rtr_negotiate_with_rebels_tt: "The target [rebels|e] lose [ShowNamedValue('rebel_progress_severe_bonus')|+=2%] progress"

rtr_call_loyalists_to_arms: "Call Defenders of the Mandate"
rtr_call_loyalists_to_arms_desc: "#flavor The realm burns, yet loyalty endures. Those who still believe in the Mandate must rise and defend it.#!\n\nA loyal state will join ongoing wars on our side."
rtr_call_loyalists_to_arms_tt: "All opposing factions are at war with [actor.GetName]"
rtr_call_loyalists_to_arms_select_country: "Select Loyalist State"
rtr_call_loyalists_to_arms_ct: "The loyalist joins all active wars against opposing factions"
rtr_call_loyalists_to_arms_at: "The loyalist loses #R 5#! $rtr_yuan_allegiance$"

rtr_appease_the_court: "Stabilize the Court"
rtr_appease_the_court_desc: "#flavor Division within the court is as dangerous as rebellion without. Securing internal unity may yet preserve the Mandate.#!\n"

rtr_rekindle_revolt: "Reignite the Struggle"
rtr_rekindle_revolt_desc: "#flavor Even in uneasy peace, ambition smolders. The struggle for power may yet be renewed.#!\n"

rtr_rein_in_area: "Consolidate the Region"
rtr_rein_in_area_desc: "#flavor Control must be made firm where it is claimed. By securing newly held lands, we ensure their loyalty in the trials ahead.#!\n\nAdds a modifier and integrates the region."

rtr_rein_in_area_select_area_title: "Select Area to Consolidate"
rtr_rein_in_area_no_areas: "@trigger_no! No valid [areas|e] available."
rtr_rein_in_area_tt: "All [locations|e] become [integrated|e] and gain a modifier for #Y 10#! years"
rtr_rein_in_area_at: "All [locations|e] in the area are integrated and gain a modifier"

rtr_declare_war_for_regional_supremacy: "Assert Supremacy"
rtr_declare_war_for_regional_supremacy_desc: "#flavor This is no mere rebellion—it is a contest for ultimate rule. Rivals must be cast down before they grow too strong.#!\n\nDeclare war on a rival state."
rtr_declare_war_for_regional_supremacy_select_title: "Select Target State"
rtr_declare_war_for_regional_supremacy_no_countries: "@trigger_no! No valid targets available."

rtr_support_faction: "Support a Claimant"
rtr_support_faction_desc: "#flavor In times of chaos, careful support may shape the future. By backing a claimant, we influence who may ultimately prevail.#!\n\nSend financial aid in exchange for improved relations."

rtr_declare_independence: "Proclaim Independence"
rtr_declare_independence_desc: "#flavor As the Mandate falters, the bonds of subjugation weaken. Now is the moment to seize destiny and stand alone.#!"

rtr_join_chinese_defense: "Defend the Mandate"
rtr_join_chinese_defense_desc: "#flavor Though rebellion offers opportunity, stability offers survival. By supporting the Mandate, we preserve the order that shields us.#!"
