l_english:
 JNZ_f: "$JNZ$"
 JNZ_f_desc: "The tribes of Jianzhou have long shared blood, custom, and the forests of southeastern Manchuria. If their chiefs are brought beneath one banner, Jianzhou can rise again as a single realm able to command the passes between Korea, Liaodong, and the Sungari basin."
 HXI_f: "$HXI$"
 HXI_f_desc: "The Haixi tribes have often stood divided, yet the Hada, Hoifa, Ula, and Yehe together form one of the great powers of the Jurchen world. By mastering their homeland and binding their banners together, Haixi can be restored as a unified state."
 YER_f: "$YER$"
 YER_f_desc: "Beyond the settled south, the forest peoples of the north range across the rivers and woodlands of northern Manchuria. Should these scattered tribes be brought under one authority, the Wild Jurchens may stand united in our own right, fierce and unconquered."
 nanai_yeren: "Nanai"
 udege_yeren: "Udege"
 nanai_yeren_ADJ: "Nanai"
 udege_yeren_ADJ: "Udege"
 country_name_jurchens: "$NAME$ Jurchens"
 country_name_jurchens_map: "$NAME$ Jurchens"
 BAL_f: "$BAL$"
 BAL_f_desc: "Balochistan is a harsh land of mountains and desert, shaped by resilience and independence. Long divided and contested by outside powers, its people now look inward. By uniting the [ShowCultureName('baloch_culture')] under one authority, we can restore order to the land and secure Balochistan's rightful place among its neighbors."

 KHP_f: "$KHP$"
 KHP_f_desc: "The highlands of Kham have long stood apart, ruled by proud tribes and bound by ancient custom. If the [ShowCultureName('khampa_culture')] can be united beneath a single purpose, Kham may rise from division and stand strong against all who would seek to dominate the plateau."

 UTS_f: "$UTS$"
 UTS_f_desc: "For generations, Ü and Tsang have vied for influence over the heart of the plateau. Should these lands be united beneath a single ruler, the long-divided center of Tibet would once more stand whole. Through this union, Ü-Tsang may reclaim its historic authority and prosperity."

 FRI_f: "$FRI$"
 FRI_f_desc: "For centuries the $FRI_ADJ$ people have stood apart — free under their own laws, ungoverned by lords or kings, bound only to each other and the sea. Now that the scattered polities of the $FRI_ADJ$ lands have united under one banner, $FRI$ rises as the living proof that a people need no crown to endure."

 HMZ: "Hamoa"
 HMZ_ADJ: "Hamoan"
 HMZ_f: "Hamoa"
 HMZ_f_desc: "At long last our rival has been conquered. Our domination of Polynesia is at hand"
 POF: "Maohi"
 POF_ADJ: "Maohi"
 POF_f: "Maohi"
 AKO: "Aleon Kein Ad"
 AKO_ADJ: "Aleon Keini"
 AKO_f: "Aleon Kein Ad"
 AKO_f_desc: "The lands of our ancestors is united at last"
 CAZ: "Carolinias"
 CAZ_ADJ: "Carolinian"
 CAZ_f: "Carolinias"
 CAZ_f_desc: "The lands of our ancestors is united at last"
 VIT: "Viti"
 VIT_ADJ: "Vitian"
 VIT_f: "Viti"
 VIT_f_desc: "From our islands in the heart of the Pacific, we have forged a nation united by the sea."
 HII: "Hawaii"
 HII_ADJ: "Hawaiian"
 HII_f: "Hawaii"
 HII_f_desc: "United by the spirit of aloha, Hawaii will grow."
 AOT: "Aotearoa"
 AOT_ADJ: "Aotearoan"
 AOT_f: "Aotearoa"
 AOT_f_desc: "The lands of our ancestors is united at last."
 POF_f_desc: "The lands of our ancestors is united at last."
 NZL: "New Zealand"
 NZL_ADJ: "New Zealand"
 NZL_f: "New Zealand"
 NZL_f_desc: "At the edge of the world we have created a paradise, ready to carry us into our future."

 PYN: "Polynesia"
 PYN_ADJ: "Polynesian"
 PYN_f: "Polynesia"
 PYN_f_desc: "Across the vast Pacific, our peoples stand in solidarity. From Hawaii to Rapa Nui, we are united by ocean and heritage."
 MIN: "Micronesia"
 MIN_ADJ: "Micronesian"
 MIN_f: "Micronesia"
 MIN_f_desc: "Across the vast Pacific, our peoples stand in solidarity. From Palau to the Gilberts, we are united by ocean and heritage."
 MLN: "Melanesia"
 MLN_ADJ: "Melanesian"
 MLN_f: "Melanesia"
 MLN_f_desc: "Across the vast Pacific, our peoples stand in solidarity. From Viti to Bismark, we are united by ocean and heritage."
 OCE: "Oceania"
 OCE_ADJ: "Oceanian"
 OCE_f: "Oceania"
 OCE_f_desc: "Our rule of the Pacific is absolute. United we march forward to our future in this everchanging world."

 POR_f: "$POR$"
 POR_f_desc: "Born in defiance along the western edge of Iberia, the Kingdom of Portugal has long stood apart from the ambitions of its neighbors. From the days of the [ShowReligionGroupAdjective('muslim')] presence in the Peninsula to the struggles against Castilian encroachment, we have carved out our sovereignty with steel and resolve. While others vie for dominion over Hispania, our destiny lies both in securing our realm and in looking beyond the horizon. It is we who shall safeguard our independence and bring glory to Portugal, upon land and sea alike!"

 NYE_f: "$NYE$"
 NYE_f_desc: "The lands of the Yuè people, from Lingnan to the Red River, shall be united once more as Nányuè or Nam Việt, restoring an ancient southern realm and forging a sovereign kingdom free from northern rule and fragmentation."

 BOA_f: "$BOA$"
 BOA_f_desc: "Known as the 'Prosperous Country in the East', the ancient kingdom of Balhae, or Bóhǎi, once stood as a powerful state in the forests of Manchuria, commanding the passes between the Korean peninsula, the Liaodong peninsula, and the Sungari basin. Believed to have been founded by the remnants of the fallen Goguryeo kingdom, Balhae was a realm of resilience and strength, thriving amidst the challenges of its environment. By uniting the Jurchen tribes of the region under one banner, we can restore the glory of Balhae as a single realm, reclaiming our heritage and securing our place among the great powers of East Asia."

 # Đại Nam
 DNM_f: "$DNM$"
 DNM_f_desc: "The lands of the Vietnamese people, from the Red River Delta to the Mekong, shall be united once more as Đại Nam, restoring an ancient southern realm and forging a sovereign kingdom free from northern rule and fragmentation."
 GII: "Gilan"
 GII_ADJ: "Gilani"
 GII_f: "Gilan"
 GII_f_desc: "Gilan has long been divided amongst the branches of our once mighty clan. But no more. Today we have reunifed our ancestoral homeland under a single banner"
 KRO: "Khorezmia"
 KRO_ADJ: "Khorezmian"
 khiva_khanate: "Khiva"
 khiva_khanate_ADJ: "Khivan"
 KRO_f: "Khorezmia"
 KRO_f_desc: "Khorezmia was brutally destroyed by Genghis Khan during his invasion of Iran. Our great empire was one casualty of many, but today we may rise again, greater than before"
 TTK: "Balkh"
 TTK_ADJ: "Balkhi"
 TTK_f: "Balkh"
 TTK_f_desc: "After the death of Muhammad Juki, Balkh was split between his two sons. Now however, his inheritance has been united. Let Balkh become the heart of the Gurkani"
 AFG: "Afghanistan"
 AFG_ADJ: "Afghani"
 AFG_f: "Afghanistan"
 AFG_f_desc: "Situated from our strongholds high in the Hindu Kush we have united the regional tribes under our banner. Though our lands are poor and barren, we have the will to endure and prosper."
 MZN_f: "Māzandarān"
 MZN_f_desc: "A unifed Capsian shore, from Astara to Astarabad. We will no longer be meer servants of the Shahs"
 sassanid_persia: "Sassanid"
 sassanid_persia_ADJ: "Sassanian"
 zoroastrian_persia: "Eranshahr"
 zoroastrian_persia_ADJ: "Eranshahri"
 iran_persia_name: "Iran"
 iran_persia_name_ADJ: "Irani"
 baluchi_kalat: "Kalat"
 baluchi_kalat_ADJ: "Kalat"
 CDL: "$dali_province$"
 CDL_ADJ: "$dali_province$"
 CDL_f: "$CDL$"
 CDL_f_desc: "The Dali Kingdom, or Dablit Guaif in the native Bai tongue, was a powerful realm in the highlands of Yunnan, commanding the trade routes between the Tibetan plateau, the Red River valley, and the heartlands of China. Founded by the remnants of the fallen Nanzhao kingdom, Dali was a realm of resilience and strength, thriving amidst the challenges of its environment. After the subjugation of the Dali Kingdom by the Mongols, the region was divided among various warlords and local powers. By uniting the tribes and factions of Yunnan under one banner, we can restore the glory of Dali as a single realm, reclaiming our heritage and securing our place among the great powers of East Asia."
 
 BGP: "Arles"
 BGP_f: "$BGP$"
 NSL_f: "Novosil"
 NSL_f_desc: "We have reunited the old Principality of Novosil under our banner. Maybe the princes of the Upper Oka can once again be free"

 BKA: "Bashkiria"
 BKA_ADJ: "Bashkir"
 BKA_f: "Bashkiria"
 BKA_f_desc: "The clans of the southern Urals have gathered under one wing. No longer will we be the footmen of foreign Khāns or the subjects of distant Princes. Our sovereignty is forged in the mountains and the forests, and it shall not be broken."
 UDM: "Udmurtia"
 UDM_ADJ: "Udmurt"
 UDM_f: "Udmurtia"
 UDM_f_desc: "The lands of Udmurtia are united under our clan. Let the Rus and the Tatar fear our state"
 MRZ: "Mari-El"
 MRZ_ADJ: "Mari"
 MRZ_f: "Mari-El"
 MRZ_f_desc: "The lands of the hills and medows are united as one. Now let us look to the future of our people"
 WHI: "White"
 WHI_ADJ: "White"
 WHI_f: "White Horde"
 WHI_f_desc: "From the expansive horizons of the eastern steppes, the left hand of the great Ulus rises once more. The legacy of Orda Khan flows through our veins, and by uniting the eastern clans, we have laid the first stone toward reclaiming dominion over the Eurasian steppe. The old empire shall rise again from the east."
 WHI_horde: "White Horde"
 WHI_horde_ADJ: "White"
 BEH: "Blue"
 BEH_ADJ: "Blue"
 BEH_f: "Blue Horde"
 BEH_f_desc: "The western lands of Jochi's patrimony have been reclaimed. From the Volga to the Urals, the right hand of the steppes has reasserted its strength, not as a fractured splinter, but as the true foundation upon which the grand empire of our ancestors will be reborn. The restoration of the great Ulus begins here."
 BEH_horde: "Blue Horde"
 BEH_horde_ADJ: "Blue"
 GTH: "Great"
 GTH_ADJ: "Great"
 GTH_f: "Great Horde"
 GTH_f_desc: "The center has held! We have outlasted our rivals and secured the old heartlands of the Sarai. While others have splintered away, we remain the legitimate keepers of the western steppe"
 GTH_horde: "Great Horde"
 GTH_horde_ADJ: "Great"
 GLH_f: "Golden Horde"
 GLH_f_desc: "The Ulus of Jochi is made whole! We have gathered the fractured shards of the blue and white banners, restoring the dominion that once brought all of Rus and the steppe to its knees. Let the golden age return!"
 GLH_horde: "Golden Horde"
 GLH_horde_ADJ: "Golden"
 GLH_cuman: "Cumania"
 GLH_cuman_ADJ: "Cuman"
 GLH_kipchak: "Kipchak"
 GLH_kipchak_ADJ: "Kipchak"
 CHG: "Moghulistan"
 CHG_ADJ: "Moghul"
 CHG_f: "$CHG$"
 CHG_f_desc: "The throne of the Second Son is no longer a prize for squabbling princes. As the sole claimant to the seat of Chagatai, we take up his mantle. From the Transoxiana to the gates of China, the heart of the world is ours once more."
 unified_chagatai: "Chagatai"
 unified_chagatai_ADJ: "Chagatai"
 UYG: "Uyghuristan"
 UYG_ADJ: "Uyghur"
 UYG_f: "$UYG$"
 UYG_f_desc: "The Altishahr—the Land of Six Cities—and the wild heights of Dzungaria are finally purged of foreign masters. The yoke of oppression has been cast into the dust, and for the first time in centuries, we stand as the masters of our own destiny in the Tarim Basin"
 UYG_non_islamic: "Altishahr"
 UYG_non_islamic_ADJ: "Altishahri"
 KHL: "Khalkha"
 KHL_ADJ: "Khalkha"
 KHL_f: "$KHL$"
 KHL_f_desc: "The great clans of the Khalkha finally look to one banner. We have brought our brethren under the singular command of a Khān, welding the nomadic heartland into a spear pointed at our enemies"
 KHL_f_tt: "This tag is only available via tribal unification within the Khalkha Ulus"
 chahar_khalkha: "Chahar"
 chahar_khalkha_ADJ: "Chahar"
 KHA: "Khorchin"
 KHA_ADJ: "Khorchin"
 KHA_f: "Khorchin"
 KHA_f_desc: "At last we have brought our brethren under the control of a single Khān. Let the great bow of Khasar sing once again!"
 KHA_f_tt: "This tag is only avaliable via tribal unification in the Khorchin Ulus"
 OIR: "Oirat"
 OIR_ADJ: "Oirat"
 OIR_f: "Oirat"
 OIR_f_desc: "The Four Oirats no longer pull in four directions. Through iron-willed centralization, we have turned the western tribes into a singular, unstoppable force. Let the world tremble: the Taishi speaks for all"
 OIR_f_tt: "This tag is only available upon reaching 100 Centralization within the Four Oirat Confederation"
 NOG_f: "Nogai"
 NOG_f_desc: "The lords and the clans of the west have finally ceased their feuds. Under a single Biy, the Nogai Orda rises—a testament to the power of the steppe against the encroaching sedentary world"
 NOG_f_tt: "This tag is only avaliable via tribal unification in the Nogai Confederation"
 URZ: "Uriankhai"
 URZ_ADJ: "Uriankhai"
 URZ_f: "Uriankhai"
 URZ_f_desc: "The wild boundary between the endless Steppe and the dark Taiga has been tamed. The 'Forest People' and the 'Guardians of the Taboo' are united; our arrows protect the north, and our scouts know no equals."
 URZ_f_tt: "This tag is only avaliable via the event Reorganization of the Uriankhai."
 YUA: "Yuan"
 YUA_ADJ: "Yuan"
 YUA_f: "Yuan"
 YUA_f_desc: "The legacy of Kublai Khān is finally within our grasp. We have mended the fractured Jade of the Empire and reclaimed the Mandate of Heaven. From the frozen steppe to the Southern Seas, the Middle Kingdom shall once again quake beneath the hooves of the Imperial Vanguard!"
 YUA_f_tt: "This tag is only available via the Restoration of the Great Yuan reform in the Northern Yuan organization."
 MGA: "Mongolia"
 MGA_ADJ: "Mongolian"
 MGO_f: "Mongolia"
 MGA_f_desc: "The era of tribal fracturing is dead. We have forged a singular nation from the fire and blood of the steppe, unified by a shared destiny rather than a foreign throne. Together we stand, masters of our own horizon, ready to face whatever the future may hold"
 MGA_f_tt: "This tag is only available via the The Eternal Nation reform in the Northern Yuan organization"
 MGE: "Mongol"
 MGE_ADJ: "Mongolian"
 MGE_f: "Mongol"