l_english:
 cb_throw_off_tatar_yoke: "Throw off the Tatar Yoke"
 cb_throw_off_tatar_yoke_desc: "We have paid tribute and bled for our overlords long enough. The tribes will unite and cast off the Tatar yoke."
 cb_enforce_tatar_yoke: "Enforce the Tatar Yoke"
 cb_enforce_tatar_yoke_desc: "These tribes have no overlord to keep them in line. We shall remedy that."
 cb_takeover_tatar_yoke: "Take over the Tatar Yoke"
 cb_takeover_tatar_yoke_desc: "These tribes pay tribute to another. Their loyalty — and their gold — should flow to us instead."

 THROW_OFF_TATAR_YOKE_WAR_NAME: "War of Liberation"
 ENFORCE_TATAR_YOKE_WAR_NAME: "War of Subjugation"
 TAKEOVER_TATAR_YOKE_WAR_NAME: "War for Suzerainty"