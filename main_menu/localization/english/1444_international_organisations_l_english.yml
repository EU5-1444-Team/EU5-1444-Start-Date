 gelug_policy: "$SECT_GELUG_NAME$"
 gelug_policy_desc: "The Gelug School, also known as the 'Yellow Hat' sect, emphasizes monastic discipline and scholarly study. Founded by Je Tsongkhapa, it integrates the teachings of the previous schools and is known for its rigorous approach to Buddhist philosophy and practice."

