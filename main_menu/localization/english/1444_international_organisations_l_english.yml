l_english:
 league_of_lezhe: "League of Lezhë"
 league_of_lezhe_desc: "Founded in the city of Lezhë on the 2 March 1444 by Skanderbeg, it is a defensive league of Albanian nobles held together by shared resistance to Ottoman expansion and backed by Venetian interests."
 diplomatic_status_league_of_lezhe_name: "Member of the League of Lezhë"
 diplomatic_status_league_of_lezhe_tooltip: "This country is part of the League of Lezhë."
 league_of_lezhe_list_who_tt: "Countries currently in the League of Lezhë."
