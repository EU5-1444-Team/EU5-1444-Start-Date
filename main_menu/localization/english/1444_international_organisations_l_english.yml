 YUAN_LEGITIMACY_TENSION: "Yuan Power Struggle"
 uriankhai_united_variable: "Unified Uriankhai"
 khalkha_confederation_legacy_modifier: "Legacy of the Unified Steppe"
 khalkha_confederation_legacy_modifier_desc: "The banners of the heartland fly as one. The memory of our unification serves as a bulwark against future fractures"
 northern_yuan_legacy_modifier: "Heirs to the World Empire"
 northern_yuan_legacy_modifier_desc: "With the Mongolian Steppe finally unified under us, the dream of reclaiming the Great Yuan has never been closer to reality"
 no_kurultai_policy: "No Kurultai"
 no_kurultai_policy_desc: "Centralized leadership dictates terms without the need for a traditional assembly of chieftains."
 no_pasture_rights_policy: "No Pasture Controls"
 no_pasture_rights_policy_desc: "Grazing lands are open and unregulated, allowing herds to move freely without state oversight."
 no_vassal_obligations_policy: "No Obligations"
 no_vassal_obligations_policy_desc: "Vassals are granted total autonomy, owing no specific military or financial service to the crown."
 no_imperial_court_policy: "No Imperial Court"
 no_imperial_court_policy_desc: "The administration operates without a formal palace hierarchy or centralized diplomatic hub."
 no_military_organization_policy: "No Military Organization"
 no_military_organization_policy_desc: "Warfare remains a localized affair, lacking a unified command structure or standing army."
 no_tribute_policy: "No Tribute"
 no_tribute_policy_desc: "Subject states and territories are exempt from regular payments or material offerings to the sovereign."
 preserve_no_authority_policy: "Preserve Independent Rule"
 preserve_no_authority_policy_desc: "The Khans stand alone, beholden to no King, Khagan or Emperor"
