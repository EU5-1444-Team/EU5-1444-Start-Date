 main_branch_plural: "Main Branches"
 main_branch_desc: "The main branch is the de facto leader of the [GetInternationalOrganizationType('japanese_clan').GetName] and serves as the seat of authority for the ruling house. All matters of seniority and leadership within the clan ultimately revolve around the $main_branch$."

 cadet_branch: "Cadet Branch"
 cadet_branch_plural: "Cadet Branches"
 cadet_branch_desc: "A cadet branch represents a lineage descended from the main line of the [GetInternationalOrganizationType('japanese_clan').GetName]. While subordinate in status, a $cadet_branch$ may rise to prominence should it surpass the main line in authority and strength."
 new_cadet_branch.tt: "We become the leader of the clan and establish a new $cadet_branch$."

