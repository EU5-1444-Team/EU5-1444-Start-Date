 LEAGUE_OF_LEZHE_LEADER_FEMALE: "Captain-General"
 league_captain: "League Captain"
 league_captain_plural: "League Captains"
 league_captain_desc: "The $league_captain$ is the leading office of the [GetUniqueInternationalOrganization('league_of_lezhe').GetName], held by the country that leads the League."
 league_backer: "League Backer"
 league_backer_plural: "League Backers"
 league_backer_desc: "The $league_backer$ is a special status in the [GetUniqueInternationalOrganization('league_of_lezhe').GetName], representing Venice's limited role as military backer against Ottoman aggression."
 venetian_governorate: "Venetian Governorate"
 venetian_governorate_plural: "Venetian Governorates"
 venetian_governorate_desc: "The $venetian_governorate$ status marks member states of the [GetUniqueInternationalOrganization('league_of_lezhe').GetName] that are Venetian governorate subjects in Albania."
