l_english:
 apply_pu_estate_satisfaction_hit_tt: "The $nobles_estate$, $clergy_estate$, and $burghers_estate$ [estates|e] of all opponents of the [resolution|e] gain [ShowNamedValue('estate_satisfaction_severe_penalty')|+=2%] [estate_satisfaction|E]"
 league_of_lezhe_defense_law: "League Defense Covenant"
 league_of_lezhe_defense_law_desc: "Defines how the League of Lezhe responds when one of its members is attacked."
 league_of_lezhe_defense_policy: "League-Only Defense"
 league_of_lezhe_defense_policy_desc: "League members defend each other. The [ShowSpecialStatusName('league_backer')] will join defensive wars only when the attacker is the Ottomans, and may withdraw by leaving the League."
 league_of_lezhe_offense_law: "League Offensive Coordination"
 league_of_lezhe_offense_law_desc: "Determines whether members of the League coordinate in offensive wars."
 league_of_lezhe_offensive_coordination_policy: "Offensive Coordination"
 league_of_lezhe_offensive_coordination_policy_desc: "League members may call each other into offensive wars."
 league_of_lezhe_no_offense_policy: "No Offensive Coordination"
 league_of_lezhe_no_offense_policy_desc: "The League is strictly defensive and does not coordinate offensive war call-ins."
 league_of_lezhe_venetian_governance_law: "Venetian Local Governance"
 league_of_lezhe_venetian_governance_law_desc: "Defines whether Venice keeps direct rule in Albania or delegates local administration to dependent governors."
 no_venetian_local_governors_policy: "Direct Venetian Rule"
 no_venetian_local_governors_policy_desc: "Venice keeps direct control over its Albanian holdings, without creating delegated governor states."
 league_of_lezhe_unification_law: "League Centralization"
 league_of_lezhe_unification_law_desc: "The League of Lezhe may either remain a defensive compact of Albanian lords or centralize under one crown."
 preserve_league_of_lezhe_policy: "Maintain the League"
 preserve_league_of_lezhe_policy_desc: "The League remains a mutual defense pact between autonomous members."
 venetian_local_governors_policy: "Delegate Venetian Governors"
 venetian_local_governors_policy_desc: "Venice delegates day-to-day governance in its Albanian holdings to loyal local governor-vassals, reducing direct administrative strain while preserving Venetian suzerainty."
 unify_albania_policy: "Unify Albania"
 unify_albania_policy_desc: "The League is consolidated under a single Albanian state, integrating the member realms."
 league_of_lezhe_unification_tt: "The League of Lezhe is unified under one Albanian crown."
 frisian_freedom_defense_law: "Frisian Mutual Defense"
 frisian_freedom_defense_law_desc: "Defines how the Frisian Freedom responds when one of its members is attacked."
 frisian_freedom_defense_policy: "Mutual Defense"
 frisian_freedom_defense_policy_desc: "All members of the Frisian Freedom are bound to defend one another when attacked. No member stands alone."
 frisian_freedom_offense_law: "Frisian Offensive Coordination"
 frisian_freedom_offense_law_desc: "Determines whether members of the Frisian Freedom coordinate in offensive wars."
 frisian_freedom_offensive_coordination_policy: "Offensive Coordination"
 frisian_freedom_offensive_coordination_policy_desc: "Members of the Frisian Freedom may call one another into offensive wars."
 frisian_freedom_no_offense_policy: "No Offensive Coordination"
 frisian_freedom_no_offense_policy_desc: "The Frisian Freedom is strictly defensive and does not coordinate offensive war call-ins."
 frisian_freedom_unification_law: "Frisian Centralization"
 frisian_freedom_unification_law_desc: "The Frisian Freedom may either remain a federation of free Frisian polities or centralize under one unified Frisian state."
 preserve_frisian_freedom_policy: "Maintain the Freedom"
 preserve_frisian_freedom_policy_desc: "The Frisian Freedom remains a federation of autonomous Frisian polities, each free under shared law."
 unify_frisia_policy: "Unify Frisia"
 unify_frisia_policy_desc: "The Frisian Freedom is consolidated under a single Frisian state, uniting the member realms into one."
 frisian_freedom_unification_tt: "The Frisian Freedom is unified under one Frisian crown."
 frisian_freedom_culture_law: "Frisian Cultural Unity"
 frisian_freedom_culture_law_desc: "Determines whether the Frisian Freedom pursues a unified Frisian cultural identity among its members."
 frisian_culture_policy: "Adopt Frisian Culture"
 frisian_culture_policy_desc: "All members of the Frisian Freedom adopt Frisian as their primary culture, strengthening the shared identity of the federation."
 frisian_culture_optional_policy: "Cultural Autonomy"
 frisian_culture_optional_policy_desc: "Members of the Frisian Freedom retain their own primary cultures. Membership does not require cultural assimilation."
 JAPANESE_CLAN_TREASURY_COST: "Clan Treasury Cost"
 japanese_clan_foundation_law: "Clan Foundation"
 japanese_clan_foundation_law_desc: "The law of the [GetInternationalOrganizationType('union').GetName] which determines its very nature and if it should follow a centralized or federal future - if it can stand the test of time."
 japanese_clan_establish_seniority_policy: "Establish Seniority"
 japanese_clan_establish_seniority_policy_desc: "A Japanese clan can only hold together through a single dominant line. Designating the senior branch of the $japanese_clan$ determines which branch shall represent the clan as a whole."
 japanese_clan_maintain_federal_status_policy: "Maintain Federal Status"
 japanese_clan_maintain_federal_status_policy_desc: "The sovereignty of each cadet branch of the $japanese_clan$ is untouchable and unquestionable. Even if all branches are under a single head, it is not the head's business to meddle in the internal affairs of each branch."
 jap_branching_clan_main_branch_policy_at: "Enables the [ShowSpecialStatusName('main_branch')] and [ShowSpecialStatusName('cadet_branch')] special statuses"
 jap_branching_clan_main_branch_policy_tt: "[ROOT.GetInternationalOrganization.GetCountryWithHighestGreatPower.GetName] becomes the [ShowSpecialStatusName('main_branch')] (branch is selected due to having the highest [great_power_score|e] within the $japanese_clan$)"
 jap_branching_clan_main_branch_policy_specific_tt: "[ROOT.GetInternationalOrganization.MakeScope.GetVariable('pre_selected_main_branch').GetCountry.GetName] becomes the [ShowSpecialStatusName('main_branch')]"
 japanese_clan_unlocks_war_for_seniority_casus_belli_tt: "Unlocks the [ShowCasusBelliName('cb_union_war_for_seniority')] [casus_belli|e] for every $cadet_branch$ who is #Y equal or stronger#! than the [ShowSpecialStatusName('main_branch')]"

 japanese_clan_codified_inheritance_law: "Codified Inheritance"
 japanese_clan_codified_inheritance_law_desc: "To secure stability within the $japanese_clan$, the inheritance laws of each branch must be codified so that every cadet branch follows the same succession principles."
 japanese_clan_senior_succession_law: "Unified Succession Law"
 japanese_clan_senior_succession_law_desc: "The succession of the $japanese_clan$ is regulated by the laws of the [ShowSpecialStatusName('main_branch')]. Every branch is compelled to adopt these laws if applicable."
 japanese_clan_sovereign_succession_law: "Sovereign Succession Law"
 japanese_clan_sovereign_succession_law_desc: "No cadet branch of the $japanese_clan$ may determine the legal succession of another branch. Each branch retains sovereignty over its own inheritance policies."
 japanese_clan_codified_inheritance_policy_at: "Every branch of the $japanese_clan$ adopts the [heir_selection|e] of the [ShowSpecialStatusName('main_branch')] if possible"
 japanese_clan_codified_inheritance_policy_bt: "#R Locked [heir_selections|e] can neither be applied nor overridden#!"
 japanese_clan_codified_inheritance_policy_ct: "Every branch of the $japanese_clan$ adopts the [ShowLawName('heir_religion_law')] of the [ShowSpecialStatusName('main_branch')] if possible"

 japanese_clan_economic_law: "Economy of the Clan"
 japanese_clan_economic_law_desc: "Even if a single head rules over multiple cadet branches, the branches remain economically distinct. This law seeks to integrate their treasuries for mutual benefit."
 japanese_clan_unified_treasury_policy: "Unified Treasury"
 japanese_clan_unified_treasury_policy_desc: "The treasuries of the $japanese_clan$ branches shall be unified into a single entity, managed by the clan head for the benefit of all branches."
 japanese_clan_cooperative_investment_policy: "Cooperative Investment"
 japanese_clan_cooperative_investment_policy_desc: "Branch treasuries serve the clan collectively, allowing investments in infrastructure and the defense of any branch in need."

 japanese_clan_diplomatic_law: "Diplomatic Liberties"
 japanese_clan_diplomatic_law_desc: "Though led by a single head, the $japanese_clan$ must define how cadet branches conduct diplomacy.\n\n#Y Warfare decisions, however, remain largely within the authority of individual branches.#!"
 japanese_clan_unified_external_diplomacy_policy: "Unified External Diplomacy"
 japanese_clan_unified_external_diplomacy_policy_desc: "External diplomacy of the $japanese_clan$ is centralized under the senior branch, while other branches are limited in foreign dealings. Warfare decisions remain with the branches, though coordination is encouraged."
 japanese_clan_organized_diplomats_policy: "Organized Diplomats"
 japanese_clan_organized_diplomats_policy_desc: "Diplomats serve the $japanese_clan$ as a whole, with abilities accessible to all branches for mutual benefit."

 japanese_clan_legislature_law: "Legislature of the Clan"
 japanese_clan_legislature_law_desc: "The administration of the $japanese_clan$ requires cohesion. A unified legislative framework ensures stability across all branches."
 japanese_clan_aligned_legislature_policy: "Aligned Legislature"
 japanese_clan_aligned_legislature_policy_desc: "To maintain administrative cohesion, all laws and policies are aligned with those of the senior branch."
 japanese_clan_aligned_legislature_policy_at: "Every branch of the $japanese_clan$ adopts the implemented [government_reforms|e] and [policies|e] where available of the [ShowSpecialStatusName('main_branch')]"
 japanese_clan_federal_legislature_policy: "Federal Legislature"
 japanese_clan_federal_legislature_policy_desc: "Customs and laws may differ among branches. Policy design remains the responsibility of individual branches, not the head."

 japanese_clan_mutual_offense_law: "Mutual Offense"
 japanese_clan_mutual_offense_law_desc: "Though primarily defensive, branches of the $japanese_clan$ may call on each other for military support if all agree."
 japanese_clan_assured_offense_policy: "Assured Offense"
 japanese_clan_assured_offense_policy_desc: "The $japanese_clan$ acts as a unified force in war, striking fear into enemies through coordinated action."
 japanese_clan_automatic_offense_policy: "Duty for Offense"
 japanese_clan_automatic_offense_policy_desc: "Branches are encouraged to join in offensive wars alongside their fellow branches."
 japanese_clan_possible_offense_policy: "Possible Offense"
 japanese_clan_possible_offense_policy_desc: "To survive and expand, branches may call upon each other in times of war."

 japanese_clan_unification_of_crowns_law: "Question of Unification"
 japanese_clan_unification_of_crowns_law_desc: "In practice, the $japanese_clan$ is a loose confederation of branches under one head. Yet unification under the senior branch remains a possibility."
 japanese_clan_rapid_crown_unification_policy: "Rapid Unification of Branches"
 japanese_clan_rapid_crown_unification_policy_desc: "Administrative improvements in the senior branch allow faster integration of cadet branches."
 japanese_clan_swift_crown_unification_policy: "Swift Unification of Branches"
 japanese_clan_swift_crown_unification_policy_desc: "Bureaucratic efficiency of the senior branch allows quicker diplomatic and administrative absorption of branches."
 japanese_clan_crown_unification_policy: "Unification of Branches"
 japanese_clan_crown_unification_policy_desc: "The time has come to centralize the $japanese_clan$. Under the guidance of the senior branch, cadet branches are integrated through diplomatic annexation."
 japanese_clan_federal_union_policy: "Federal Clan"
 japanese_clan_federal_union_policy_desc: "The $japanese_clan$ primarily functions as a defensive alliance. Branches retain sovereignty, and unification into a single political entity is not required."

 polyandry: "Polyandry"
 polyandry_desc: "Marriage between a woman and multiple men is practiced to preserve family land and resources, often among brothers who share a household and responsibilities."

 #Composite Monarchy Laws
 composite_monarchy_foundation_law: "Foundation of the Crown"
 composite_monarchy_foundation_law_desc: "The foundational law defining the nature of the composite monarchy and the relationship between the Crown and its constituent realms."
 composite_maintain_autonomy_policy: "Maintain Autonomy"
 composite_maintain_autonomy_policy_desc: "The realms retain their full autonomy under the Crown. No further integration is pursued, preserving the traditional rights and privileges of each member."
 composite_unite_crowns_policy: "Unite the Crowns"
 composite_unite_crowns_policy_desc: "The Crown asserts its authority over the constituent realms, beginning the process of integration. The royal court is established as the central institution binding the realms together."

 composite_monarchy_inheritance_law: "Succession of the Crown"
 composite_monarchy_inheritance_law_desc: "Determines how succession is handled across the member realms of the composite monarchy."
 composite_separate_succession_policy: "Separate Successions"
 composite_separate_succession_policy_desc: "Each realm retains its own succession laws and practices. The Crown passes to the same heir across all realms, but the internal succession of each member remains a matter of local custom."
 composite_common_succession_policy: "Common Succession"
 composite_common_succession_policy_desc: "A unified succession law is established across all realms of the Crown. The inheritance of each member realm follows the same principles, strengthening the dynastic bond."

 composite_monarchy_administration_law: "Administration of the Crown"
 composite_monarchy_administration_law_desc: "Defines how the constituent realms are administered and how royal authority is exercised over local governance."
 composite_regional_administration_policy: "Regional Administration"
 composite_regional_administration_policy_desc: "Each realm governs itself according to its own customs and institutions. Royal administration is limited to matters that concern the Crown as a whole."
 composite_unified_administration_policy: "Unified Administration"
 composite_unified_administration_policy_desc: "A central administrative apparatus is established under the Crown. Royal officials oversee governance across all realms, harmonizing laws and reducing bureaucratic duplication."

 composite_monarchy_treasury_law: "Treasury of the Crown"
 composite_monarchy_treasury_law_desc: "Governs how revenues are collected and managed across the member realms of the composite monarchy."
 composite_local_treasury_policy: "Local Treasury"
 composite_local_treasury_policy_desc: "Each realm manages its own treasury independently. The Crown receives only the traditional dues and tributes owed by each member."
 composite_shared_treasury_policy: "Shared Treasury"
 composite_shared_treasury_policy_desc: "A portion of each realm's revenues is contributed to a shared royal treasury for the common defense and administration of the Crown."
 composite_unified_treasury_policy: "Unified Treasury"
 composite_unified_treasury_policy_desc: "All revenues flow into a single royal treasury managed by the Crown. Expenditures are allocated according to the needs of the entire composite monarchy."

 composite_monarchy_military_law: "Forces of the Crown"
 composite_monarchy_military_law_desc: "Determines the military organization of the composite monarchy and how the armed forces of the member realms are coordinated."
 composite_regional_forces_policy: "Regional Forces"
 composite_regional_forces_policy_desc: "Each realm maintains its own military forces under local command. The Crown may call upon these forces for the common defense, but their organization remains a matter of local prerogative."
 composite_royal_army_policy: "Royal Army"
 composite_royal_army_policy_desc: "A unified royal army is established under direct Crown command. Member realms contribute to a standing force that serves the entire composite monarchy, improving coordination and military effectiveness."

 composite_monarchy_unification_law: "Unification of the Crown"
 composite_monarchy_unification_law_desc: "The ultimate law of the composite monarchy, charting the path toward full unification of the constituent realms under a single crown."
 composite_crown_unification_policy: "Crown Unification"
 composite_crown_unification_policy_desc: "The Crown moves to fully integrate the constituent realms into a single unified state. Member realms may be annexed diplomatically as integration reaches its peak, bringing the composite monarchy to its culmination."