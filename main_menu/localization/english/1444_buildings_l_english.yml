l_english:
  ganden_monastery: "Ganden Monastery"
  ganden_monastery_desc: "The Ganden Monastery was founded in 1409 by Je Tsongkhapa, the founder of the Gelugpa tradition of Tibetan Buddhism. It is one of the 'great three' Gelugpa university monasteries of Tibet, along with Sera Monastery and Drepung Monastery.
  gelugpa_institution: "Gelugpa Institution"

  mount_athos_monastery: "Mount Athos Monastery"
  mount_athos_monastery_desc: "Founded by Athanasios the Athonite, the monastic community of Mount Athos occupies one of the holiest sites in Orthodox Christendom and features a rich collection of well-preserved artifacts, rare books, ancient documents, and artworks of immense value."

 ordos_garrison: "Weisuo"
 ordos_garrison_desc: "A Weisuo garrison is a Ming military installation projecting imperial authority into territory beyond direct control. Although far from resupply and reinforcement, these garrisons maintain a foothold in the borderlands."
 ruined_great_wall_of_china: "Han Border Wall"
 ruined_great_wall_of_china_desc: "The $ruined_great_wall_of_china$ are the remnants of the ancient frontier walls constructed during the Han dynasty to guard against nomadic incursion. Long since fallen into disrepair, little remains beyond earthen mounds and crumbling rammed earth foundations."
 repaired_great_wall_of_china: "Great Wall of Ming"
 repaired_great_wall_of_china_desc: "The $repaired_great_wall_of_china$ is a continuous fortified barrier constructed by Ming to defend the northern frontier against Mongol raids. Stretching from the Gansu corridor to the Liaodong peninsula, it represents an enormous investment in the security of the empire."