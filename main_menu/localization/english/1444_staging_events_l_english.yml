l_english:

  # Ottomans
  1444_staging_events.1.title: "Victory at Varna"
  1444_staging_events.1.desc: "By the grace of Allah and the divine favor bestowed upon the faithful, [GetCharacter('tur_murad_ii_ottomans').GetName] led the armies of the sublime Ottoman state to a magnificent triumph at [ShowLocationName('varna')] on this blessed day. The crusading forces of the Hungarians and their Christian allies, who had dared to break the sacred peace treaty, were shattered before the might of our janissaries and sipahi cavalry like reeds before a great wind.\n     The young and reckless [GetCharacter('pol_wladyslaw_iii_jagiellon').GetName] of Poland and Hungary fell upon the field of battle, his arrogance meeting its just end at the hands of our valiant ghazis. His severed head, preserved in honey, was carried as testament to all who would dare challenge the power of the House of Osman.\n     Truly, this victory at Varna sealed the fate of the Balkans and proclaimed to all the world that Allah's blessing rested firmly upon the banners of our Sultan. Now, our destiny lies at the gates of [ShowLocationName('constantinople')], to establish our dominion as the true heirs of Rūm!"
  1444_staging_events.1.historical_info: "On the 10th of November, 1444, the Ottoman forces under Sultan Murad II met the crusading army near the Black Sea port of Varna, bringing the campaign to a decisive conclusion. The Hungarian and Polish king, Władysław III, had advanced his cavalry in a bold but ultimately costly charge that broke the cohesion of the Christian force. Ottoman discipline and numerical strength proved decisive on the field, and King Władysław himself was killed in the fighting, effectively ending organized resistance. With the crusading army shattered and its commanders dead or fled, Sultan Murad secured Ottoman dominance over the Balkans and removed the most serious Western military challenge his reign had faced. The victory at Varna would go on to radically shape the political landscape of southeastern Europe and contribute to the fall of Constantinople in 1453."
  1444_staging_events.1.a: "Ever Victorious!"

  1444_staging_events.6.title: "Winter's Prelude"
  1444_staging_events.6.desc: "[GetCountry('ENG').GetName] finds herself at a most perilous crossroads, her great ambitions in [GetCountry('FRA').GetName] rapidly crumbling against the élan of French knights. The war against the French, now stretching beyond the memory of living men, has bled the treasury dry and sent countless English sons to die in foreign mud, with little to show for their sacrifice but a fragile truce brokered at Tours.\n     Our king, [GetCharacter('eng_henry_vi_lancaster').GetName], God save him, is a pious and gentle soul — perhaps too gentle — for he lacks the iron will and martial fire of his father, the great [GetCharacter('eng_henry_v_lancaster').GetName], and the realm grows restless under a crown that seems to sit uneasily upon his head. The great lords of England — York, Somerset, and their ilk — eye one another with barely concealed contempt, their rivalries festering like an unhealed wound, each man measuring his own claim and consequence against the king's perceived weakness.\n     God willing, England shall weather this storm, but there are those who whisper in dark corners that the peace within our own borders may yet prove more fragile than any treaty signed with France."
  1444_staging_events.6.historical_info: "By 1444, England's position in the [ShowSituationName('hundred_years_war')] had deteriorated sharply from the conquests of Henry V, with French military resurgence steadily eroding the gains enshrined in the Treaty of Troyes in 1420. The Treaty of Tours that year secured a truce through Henry VI's betrothal to [GetCharacter('eng_marguerite_valois_anjou').GetName], but was widely seen as a diplomatic concession that resolved none of the underlying territorial disputes. Henry VI himself compounded the crisis through his passivity and lack of political or military aptitude, creating a vacuum of royal authority that invited fierce factional rivalry among the nobility. This competition centred increasingly on [GetCharacter('eng_richard_of_york_duke').GetName], Duke of York, whose strong claim to the throne through descent from [GetCharacter('eng_edward_iii').GetName] placed him in direct tension with the court faction surrounding [GetCharacter('eng_edmund_beaufort_somerset').GetName], Duke of Somerset. Though the Wars of the Roses would not formally begin until 1455, the structural conditions that would produce that conflict — a weak king, dynastic uncertainty, rival noble factions, and military failure abroad — were already firmly established."
  1444_staging_events.6.a: "Dieu et mon droit!"
