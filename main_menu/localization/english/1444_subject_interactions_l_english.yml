l_english:
 governorate: "Governorate"
 governorate_desc: "A $governorate$ is a delegated [subject|e] with obligations and rights equivalent to a [ShowSubjectTypeName('vassal')], established to administer a specific region on behalf of its [overlord|e]."
 LEAD_governorate: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_governorate: "[SUBJECT_TYPE.GetName] of $LIST$."

 timurid_appanage: "Timurid Appanage"
 timurid_appanage_desc: "Shah Rukh Mirza, the third son of Timur, has managed to resurect his empire. But his hold is fragile, and many heirs of Timur wish to rule instead"
 LEAD_timurid_appanage: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_timurid_appanage: "[SUBJECT_TYPE.GetName] of $LIST$."
 TIMURID_APPANAGE_WANTS_OVERLORD: "Nope"
 TIMURID_APPANAGE_WANTS_SUBJECT: "Nope"

 voivodeship: "Powerful Voivodeship"
 voivodeship_desc: "A $voivodeship$ is a [subject|e] that has great de-facto powers or specific autonomous rights granted to the local nobility within its overlord territories, but is directly administered by its [overlord|e] through appointed governors called 'voivodes'. It is thus easier to integrate directly into the royal domain than a regular subject."
 LEAD_voivodeship: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_voivodeship: "[SUBJECT_TYPE.GetName] of $LIST$."