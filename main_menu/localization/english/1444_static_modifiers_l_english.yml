l_english:

 # England
 STATIC_MODIFIER_NAME_eng_unstable_country: "Winter of Discontent"
 STATIC_MODIFIER_DESC_eng_unstable_country: "[GetCountry('ENG').GetName] is in a dire state. \n\nOur recent losses against the Valois pretenders in [GetCountry('FRA').GetName] has decisively turned the momentum of the [ShowSituationName('hundred_years_war')] to the Valois side, threatening us with a complete collapse of our continental possessions. While England has arguably weathered worse over the centuries, we have always been led by a strong and competent monarch who has reversed our misfortunes.\n\nKing Henry VI is not one of these men.\n\nUnlike his father, he is almost completely lacking military experience and his ineptitude in almost area of governance has alienated much of the nobility, leaving our state fragile and weak. Even if we remove him from power, the damage to our institutions will take years to fully recover. \n\nThe seeds of conflict are being sown, and a #bold winter of discontent#! is almost upon us."

 # Crimea
 STATIC_MODIFIER_NAME_azov_campaign: "Azov Campaign"
 STATIC_MODIFIER_DESC_azov_campaign: "Our campaign around Azov has focused the Khanate's military efforts on a single objective. For now, our armies fight with unusual discipline and resolve."


 STATIC_MODIFIER_NAME_kaiser_i_rum: "Kayser-i-Rûm"
 STATIC_MODIFIER_DESC_kaiser_i_rum: "The title of Kayser-i Rûm, or 'Caesar of Rome', is a prestigious title that evokes the legacy of the Roman Empire and its emperors. By adopting this title, the Ottoman ruler asserts their claim to be the rightful heir to the Roman imperial tradition, positioning themselves as a powerful and legitimate ruler in the eyes of their subjects and the world. The title emphasizes the Ottoman Empire's connection to the rich history and cultural heritage of the Roman Empire, while also asserting its own authority and dominance in the region."
 STATIC_MODIFIER_NAME_caliph: "Caliph"
 STATIC_MODIFIER_DESC_caliph: "The title of Caliph is a significant and revered title in the Islamic world, denoting the leader of the Muslim community and the successor to the Prophet Muhammad. By adopting the title of Caliph, the Ottoman ruler asserts their role as the spiritual and political leader of the Muslim world, positioning themselves as the protector of the faith and the unifier of the Muslim ummah. The title emphasizes the Ottoman Empire's connection to Islamic history and tradition, while also asserting its authority and legitimacy as a major power in the region. The Caliphate is a symbol of religious and political authority, and the Ottoman ruler's claim to this title reflects their ambition to be recognized as a dominant force in both the Islamic world and global affairs."
 STATIC_MODIFIER_NAME_beylerbey: "Beylerbey"
 STATIC_MODIFIER_DESC_beylerbey: "The title of Beylerbey, meaning 'Lord of Lords' or 'Master of Governors', is a prestigious title that signifies the Ottoman ruler's authority over their provincial governors and their status as a powerful and influential leader. By adopting this title, the Ottoman ruler asserts their dominance and control over their vast empire, emphasizing their role as the supreme authority in the land. The title highlights the Ottoman Empire's administrative structure and the ruler's ability to govern effectively through a network of loyal governors, while also asserting their legitimacy and strength in the eyes of their subjects and rival powers."
 STATIC_MODIFIER_NAME_padishah: "Padishah"
 STATIC_MODIFIER_DESC_padishah: "The title of Padishah, meaning 'Sovereign above all kings', is a prestigious and exalted title that signifies the Ottoman ruler's supreme authority and dominance over other monarchs. By adopting the title of Padishah, the Ottoman ruler asserts their position as the highest-ranking sovereign, emphasizing their superiority and legitimacy in the eyes of their subjects and rival powers. The title highlights the Ottoman Empire's status as a major power in the region and its ruler's ambition to be recognized as a dominant force in global affairs. The title of Padishah reflects the Ottoman ruler's desire to be seen as a powerful and influential leader, commanding respect and obedience from their subjects and asserting their authority over other monarchs."